<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMX Emulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background-color: #050608; display: flex; justify-content: center; align-items: center; position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; perspective: 1000px; font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif; }
        #rotate-message { display: none; color: #fff; font-size: 1.5rem; text-align: center; font-weight: bold; letter-spacing: 2px; }
        @media (orientation: portrait) { #gmx-console { display: none !important; } #rotate-message { display: block; } }
        @media (orientation: landscape) {
            #gmx-console { position: relative; display: flex; justify-content: center; align-items: center; width: 735px; height: 350px; background: #40D0D0; border-radius: 36px; box-shadow: inset 0 0 4px rgba(255,255,255,0.05), inset 2px 2px 10px rgba(255,255,255,0.08), inset -3px -3px 15px rgba(0,0,0,0.6), -10px -10px 25px rgba(0,0,0,0.4), 15px 15px 45px rgba(0,0,0,0.8); overflow: hidden; transform-origin: center center; border: 1px solid #353942; }
            #screen-bezel { position: absolute; width: 60%; height: 84%; background: linear-gradient(180deg, #020202 0%, #0a0a0c 100%); border-radius: 12px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), inset 0 0 20px rgba(0,0,0,1), 0 12px 25px rgba(0,0,0,0.6); z-index: 10; padding: 4px; border: 1px solid #111; }
            #screen { position: relative; width: 100%; height: 100%; background: #030303; border-radius: 10px; box-shadow: inset 0 0 35px rgba(0,0,0,1), 0 0 0 1px rgba(255,255,255,0.03); transition: background 0.5s ease; overflow: hidden; display: flex; justify-content: center; align-items: center; }
            #screen.boot-white { background: #ffffff; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
            #boot-logo-container { position: absolute; display: flex; align-items: flex-start; opacity: 0; z-index: 20; }
            #boot-gmx { font-size: 3rem; font-weight: 900; font-style: italic; letter-spacing: -2px; background: linear-gradient(to bottom, #1e1e1e 0%, #444 50%, #1e1e1e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
            #boot-reg { font-size: 0.8rem; font-weight: bold; color: #444; margin-top: 8px; margin-left: 4px; opacity: 0; }
            #boot-gmx::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-20deg); pointer-events: none; }
            @keyframes gbaDrop { 0% { transform: translateY(-80px) scale(1.1); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
            @keyframes glintSweep { 0% { left: -150%; } 100% { left: 200%; } }
            @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
            @keyframes fadeOut { 100% { opacity: 0; } }
            .do-drop { animation: gbaDrop 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
            .do-glint::after { animation: glintSweep 0.5s ease-in-out forwards; }
            .do-fade-in { animation: fadeIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
            .do-fade-out { animation: fadeOut 0.5s ease forwards; }
            .xmb-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; background: linear-gradient(135deg, #181926 0%, #0f101a 50%, #08080d 100%); z-index: 1; }
            .xmb-game-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center right; opacity: 0; transition: opacity 0.4s ease; z-index: -1; }
            .wave-line { position: absolute; width: 150%; height: 150px; background: rgba(255,255,255,0.01); border-top: 1px solid rgba(255,255,255,0.08); border-radius: 50%; top: 30%; left: -25%; transform: rotate(-8deg); box-shadow: 0 -2px 15px rgba(255,255,255,0.02); }
            .wave-line:nth-child(3) { top: 40%; transform: rotate(5deg) scaleY(1.2); border-top: 1px solid rgba(255,255,255,0.05); }
            #xmb-ui { position: absolute; width: 100%; height: 100%; z-index: 10; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; color: #fff; }
            #screen.os-ready .xmb-bg { opacity: 1; }
            #screen.os-ready #xmb-ui { opacity: 1; pointer-events: auto; }
            #xmb-header { position: absolute; top: 8%; right: 4%; font-size: 0.75rem; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.9); display: flex; align-items: center; gap: 10px; opacity: 0.8; }
            .battery-icon { width: 22px; height: 10px; border: 1.5px solid #fff; border-radius: 2px; position: relative; }
            .battery-icon::after { content: ''; position: absolute; right: -4px; top: 1.5px; width: 2px; height: 4px; background: #fff; border-radius: 0 2px 2px 0; }
            .battery-fill { width: 100%; height: 100%; background: #fff; border: 1px solid transparent; background-clip: content-box; }
            #xmb-grid { position: absolute; top: 40%; left: 50%; display: flex; gap: 80px; transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
            .xmb-col { display: flex; flex-direction: column; align-items: center; gap: 40px; transition: opacity 0.25s, transform 0.25s; opacity: 0.3; transform: scale(0.85); }
            .xmb-col.active-col { opacity: 1; transform: scale(1); }
            .xmb-main { position: relative; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
            .xmb-icon { width: 40px; height: 40px; fill: #ffffff; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); transition: all 0.2s; }
            .xmb-main span { position: absolute; left: 130%; top: 50%; transform: translateY(-50%); font-size: 0.9rem; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity 0.2s; text-shadow: 0 2px 5px rgba(0,0,0,0.9); }
            .active-col .active-item.xmb-main .xmb-icon { transform: scale(1.3); filter: drop-shadow(0 0 20px rgba(255,255,255,0.6)); }
            .active-col .active-item.xmb-main span { opacity: 1; }
            .xmb-sub { font-size: 0.85rem; font-weight: 500; opacity: 0; text-shadow: 0 2px 5px rgba(0,0,0,0.9); transition: all 0.2s; white-space: nowrap; }
            .active-col .xmb-sub { opacity: 0.5; }
            .active-col .active-item.xmb-sub { opacity: 1; transform: scale(1.15); font-weight: 700; }
            .game-item { display: flex; align-items: center; justify-content: center; position: relative; }
            .box-art { width: 60px; height: 40px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
            .active-col .active-item.game-item .box-art { border: 2px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.5), 0 8px 15px rgba(0,0,0,0.8); transform: scale(1.1); }
            .game-details { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; opacity: 0; transition: opacity 0.2s; }
            .active-col .active-item.game-item .game-details { opacity: 1; }
            .game-title { font-size: 0.85rem; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
            #sys-msg { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s; z-index: 50; text-transform: uppercase; color: #aaa; white-space: nowrap; }
            /* Game display: IodineGBA renders into a canvas */
            #game-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; justify-content: center; align-items: center; background: #000; }
            #screen.game-running #game-area { opacity: 1; pointer-events: auto; }
            #screen.game-running #xmb-ui { opacity: 0; pointer-events: none; }
            #screen.game-running .xmb-bg { opacity: 0; }
            #game-canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
            #install-popup { position: absolute; width: 100%; height: 100%; top: 0; left: 0; background: rgba(0,0,0,0.9); z-index: 60; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
            #install-popup.visible { display: flex; }
            .popup-box { width: 80%; max-width: 280px; background: linear-gradient(135deg, #1c1d26, #0d0e14); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; color: #fff; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.05); font-family: inherit; }
            .popup-box h3 { font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; color: #ddd; }
            .popup-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; font-size: 0.8rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
            .popup-btn:active { background: rgba(255,255,255,0.1); transform: translateY(2px); }
            .popup-btn.install-btn { background: linear-gradient(to bottom, #4a4e69, #2b2d42); border-color: #5a5e79; margin-top: 20px; color: #fff; }
            .popup-btn.install-btn:disabled { opacity: 0.3; pointer-events: none; }
            .file-name { font-size: 0.65rem; color: #888; margin-top: 4px; word-break: break-all; font-family: monospace; }
        }
        .shoulder-group { position: absolute; top: 7%; }
        .left-shoulder { left: 10%; transform: translateX(-50%); }
        .right-shoulder { right: 10%; transform: translateX(50%); }
        .btn-shoulder { background: linear-gradient(180deg, #FFF4E9 0%, #FFF4E9 90%, #22252a 100%); color: #888c94; border-radius: 12px; padding: 6px 22px; font-size: 0.75rem; font-weight: 800; box-shadow: inset 0 2px 2px rgba(255,255,255,0.15), inset 0 -2px 4px rgba(0,0,0,0.8), 0 5px 8px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.8); cursor: pointer; transition: transform 0.1s ease-out, box-shadow 0.1s ease-out; border: 1px solid #FFF4E9; }
        .btn-shoulder:active, .btn-shoulder.pressed { background: linear-gradient(180deg, #968E85 0%, #968E85 90%,#15171a 100%); transform: translateY(3px); box-shadow: inset 0 3px 6px rgba(0,0,0,0.9), inset 0 -1px 2px rgba(255,255,255,0.02), 0 2px 3px rgba(0,0,0,0.4); color: #555960; }
        .control-base { position: absolute; top: 30%; width: 18%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, #FFFFFF 0%, #FFFFFF 50%, #FFFFFF 100%); border: 0.01px solid #FFF4E9; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), inset 0 -2px 15px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.6), 0 0 0 1px #444a55; }
        .left-base { left: 10%; transform: translateX(-50%); }
        .right-base { right: 10%; transform: translateX(50%); }
        .d-pad-cross { position: relative; width: 80%; height: 80%; background: linear-gradient(135deg, #FFF4E9 0%, #FFF4E9 90%,#15171a 100%); border-radius: 50%; box-shadow: inset 0 1px 2px rgba(255,255,255,0.08), 0 6px 10px rgba(0,0,0,0.7); }
        .d-btn { position: absolute; width: 28%; height: 32%; cursor: pointer; background: #2a2c30; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; transition: filter 0.1s, transform 0.1s; border: 1px solid #1a1a1a; }
        .d-btn.pressed { background: #1a1a1a; filter: brightness(0.8); transform: translateY(2px); box-shadow: inset 0 2px 6px rgba(0,0,0,0.9); }
        .d-up { top: 7%; left: 36%; border-radius: 6px 6px 12px 12px; }
        .d-right { top: 34%; right: 7%; border-radius: 12px 6px 6px 12px; height: 28%; width: 32%; }
        .d-down { bottom: 7%; left: 36%; border-radius: 12px 12px 6px 6px; }
        .d-left { top: 34%; left: 7%; border-radius: 6px 12px 12px 6px; height: 28%; width: 32%; }
        .action-pad-gba { position: relative; width: 90%; height: 90%; }
        .btn-action-gba { position: absolute; width: 38%; height: 38%; border-radius: 50%; background: linear-gradient(180deg, #444a52 0%, #2a2d33 100%); box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), 0 4px 8px rgba(0,0,0,0.7); color: #dcdcdc; font-weight: 800; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; text-shadow: 0 -1px 1px rgba(0,0,0,0.8); border: 1px solid #151515; }
        .btn-action-gba.pressed { transform: translateY(3px); box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 1px 2px rgba(0,0,0,0.6); background: linear-gradient(180deg, #2a2d33 0%, #1e2025 100%); color: #aaaaaa; }
        .btn-gba-a { top: 20%; right: 8%; }
        .btn-gba-b { bottom: 20%; left: 8%; }
        #gmx-logo { position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #ffffff 0%, #a0a5b0 40%, #60646b 50%, #a0a5b0 60%, #ffffff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; font-size: 0.95rem; font-style: italic; font-weight: 900; letter-spacing: 1px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8)); }
        .bottom-btn { position: absolute; bottom: 2%; background: linear-gradient(180deg, #FFF4E9 0%, #FFFFFF 100%); color: #777; border-radius: 8px; padding: 4px 12px; font-size: 0.5rem; font-weight: 800; text-transform: uppercase; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.9), 0 4px 6px rgba(0,0,0,0.6); cursor: pointer; border: 1px solid #0a0a0a; letter-spacing: 0.5px; transition: transform 0.1s, box-shadow 0.1s; }
        .bottom-btn.pressed { box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); transform: translateY(2px); color: #444; }
        .select-btn { left: 35%; }
        .start-btn { right: 35%; }
        .power-btn { right: 20%; }
        .led-indicator { position: absolute; bottom: 3.5%; right: 28%; width: 6px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2a1a1a 0%, #0a0505 100%); box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.05); transition: background 0.1s ease, box-shadow 0.1s ease; border: 1px solid #000; }
        .led-indicator.is-on { background: radial-gradient(circle at 40% 40%, #ffffff 0%, #00ffcc 40%, #006655 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 6px #00ffcc, 0 0 12px rgba(0,255,204,0.3); }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050608; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: #40D0D0; font-family: 'Century Gothic', sans-serif; }
        #loading-overlay.hidden { display: none; }
        .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(64,208,208,0.2); border-top: 3px solid #40D0D0; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="loader-spinner"></div>
        <div style="font-size:0.9rem;font-weight:700;letter-spacing:2px;">LOADING CORE...</div>
    </div>
    <input type="file" id="install-rom-upload" accept=".gba,.GBA" style="position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px;" touch-action="auto">
    <input type="file" id="install-cover-upload" accept="image/*" style="position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px;" touch-action="auto">
    <input type="file" id="install-bios-upload" accept=".bin,.BIN" style="position:absolute;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px;" touch-action="auto">
    <div id="rotate-message">PLEASE ROTATE DEVICE</div>
    <div id="gmx-console">
        <div class="shoulder-group left-shoulder"><div class="btn-shoulder" id="btn-l">L</div></div>
        <div class="control-base left-base">
            <div class="d-pad-cross">
                <div class="d-btn d-up" id="btn-up"></div>
                <div class="d-btn d-right" id="btn-right"></div>
                <div class="d-btn d-down" id="btn-down"></div>
                <div class="d-btn d-left" id="btn-left"></div>
            </div>
        </div>
        <div id="screen-bezel">
            <div id="screen">
                <div id="boot-logo-container">
                    <div id="boot-gmx">GMX</div><div id="boot-reg">&reg;</div>
                </div>
                <div class="xmb-bg">
                    <div id="game-bg-layer" class="xmb-game-bg"></div>
                    <div class="wave-line"></div><div class="wave-line"></div>
                </div>
                <div id="xmb-ui">
                    <div id="xmb-header">
                        <span id="xmb-clock"></span>
                        <div class="battery-icon"><div class="battery-fill"></div></div>
                    </div>
                    <div id="xmb-grid">
                        <div class="xmb-col">
                            <div class="xmb-main">
                                <svg class="xmb-icon" viewBox="0 0 24 24"><path d="M17 6h-2V4c0-1.1-.9-2-2-2h-2c-1.1 0-2 .9-2 2v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2h2v2h-2V4z M19 18H5V11h14v7z M5 9V8h14v1H5z"/></svg>
                                <span>Settings</span>
                            </div>
                            <div class="xmb-sub">Insert Core (BIOS)</div>
                        </div>
                        <div class="xmb-col" id="game-column">
                            <div class="xmb-main">
                                <svg class="xmb-icon" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h4l2-2h6l2 2h4c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm6.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm2-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                                <span>Game</span>
                            </div>
                            <div class="xmb-sub" id="memory-stick">Memory Stick (Install)</div>
                        </div>
                        <div class="xmb-col">
                            <div class="xmb-main">
                                <svg class="xmb-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                                <span>About</span>
                            </div>
                            <div class="xmb-sub">Version 2.0 (GBA)</div>
                        </div>
                    </div>
                    <div id="sys-msg">Press 'A' to execute</div>
                </div>
                <div id="install-popup">
                    <div class="popup-box" id="popup-box-game" style="display:block;">
                        <h3>Install to Memory Stick</h3>
                        <label for="install-rom-upload" class="popup-btn" style="cursor:pointer;touch-action:auto;">Select .GBA ROM</label>
                        <div class="file-name" id="popup-rom-name"></div>
                        <label for="install-cover-upload" class="popup-btn" style="cursor:pointer;touch-action:auto;">Select Cover Art</label>
                        <div class="file-name" id="popup-cover-name"></div>
                        <button class="popup-btn install-btn" id="popup-install" disabled style="touch-action:auto;">Install</button>
                    </div>
                    <div class="popup-box" id="popup-box-bios" style="display:none;">
                        <h3>Insert Core (BIOS)</h3>
                        <div style="font-size:0.7rem;color:#888;margin-bottom:12px;">Required to play games.<br>Upload your GBA BIOS .bin file.</div>
                        <label for="install-bios-upload" class="popup-btn" style="cursor:pointer;touch-action:auto;">Select BIOS .bin</label>
                        <div class="file-name" id="popup-bios-name"></div>
                        <button class="popup-btn install-btn" id="popup-install-bios" disabled style="touch-action:auto;">Install Core</button>
                    </div>
                </div>
                <div id="game-area">
                    <canvas id="game-canvas" width="240" height="160"></canvas>
                </div>
            </div>
        </div>
        <div id="gmx-logo">GMX</div>
        <div class="bottom-btn select-btn" id="btn-select">SELECT</div>
        <div class="bottom-btn start-btn" id="btn-start">START</div>
        <div class="led-indicator" id="power-led"></div>
        <div class="bottom-btn power-btn" id="btn-power">POWER</div>
        <div class="shoulder-group right-shoulder"><div class="btn-shoulder" id="btn-r">R</div></div>
        <div class="control-base right-base">
            <div class="action-pad-gba">
                <div class="btn-action-gba btn-gba-a" id="btn-a">A</div>
                <div class="btn-action-gba btn-gba-b" id="btn-b">B</div>
            </div>
        </div>
    </div>

    <script>
    // ===================== GBA ENGINE: IodineGBA =====================
    var IodineGUI = { Iodine: null, Blitter: null, coreTimerID: null, isPlaying: false, startTime: +(new Date()).getTime() };
    var isRunning = false;

    // Button index map: A=0,B=1,Select=2,Start=3,Right=4,Left=5,Up=6,Down=7,R=8,L=9
    var btnBits = {
        'btn-a':0,'btn-b':1,'btn-select':2,'btn-start':3,
        'btn-right':4,'btn-left':5,'btn-up':6,'btn-down':7,
        'btn-r':8,'btn-l':9
    };

    var iodineScriptsLoaded = false;
    function loadIodineScripts(cb){
        if(iodineScriptsLoaded){ cb(); return; }
        var BASE = 'https://cdn.jsdelivr.net/gh/taisel/IodineGBA@master/';
        var scripts = [
            'IodineGBA/includes/TypedArrayShim.js',
            'IodineGBA/core/Cartridge.js','IodineGBA/core/DMA.js','IodineGBA/core/Emulator.js',
            'IodineGBA/core/Graphics.js','IodineGBA/core/RunLoop.js','IodineGBA/core/Memory.js',
            'IodineGBA/core/IRQ.js','IodineGBA/core/JoyPad.js','IodineGBA/core/Serial.js',
            'IodineGBA/core/Sound.js','IodineGBA/core/Timer.js','IodineGBA/core/Wait.js',
            'IodineGBA/core/CPU.js','IodineGBA/core/Saves.js',
            'IodineGBA/core/sound/FIFO.js','IodineGBA/core/sound/Channel1.js',
            'IodineGBA/core/sound/Channel2.js','IodineGBA/core/sound/Channel3.js',
            'IodineGBA/core/sound/Channel4.js',
            'IodineGBA/core/CPU/ARM.js','IodineGBA/core/CPU/THUMB.js','IodineGBA/core/CPU/CPSR.js',
            'IodineGBA/core/graphics/Renderer.js','IodineGBA/core/graphics/RendererShim.js',
            'IodineGBA/core/graphics/RendererProxy.js','IodineGBA/core/graphics/BGTEXT.js',
            'IodineGBA/core/graphics/BG2FrameBuffer.js','IodineGBA/core/graphics/BGMatrix.js',
            'IodineGBA/core/graphics/AffineBG.js','IodineGBA/core/graphics/ColorEffects.js',
            'IodineGBA/core/graphics/Mosaic.js','IodineGBA/core/graphics/OBJ.js',
            'IodineGBA/core/graphics/OBJWindow.js','IodineGBA/core/graphics/Window.js',
            'IodineGBA/core/graphics/Compositor.js',
            'IodineGBA/core/memory/DMA0.js','IodineGBA/core/memory/DMA1.js',
            'IodineGBA/core/memory/DMA2.js','IodineGBA/core/memory/DMA3.js',
            'IodineGBA/core/cartridge/SaveDeterminer.js','IodineGBA/core/cartridge/SRAM.js',
            'IodineGBA/core/cartridge/FLASH.js','IodineGBA/core/cartridge/EEPROM.js',
            'IodineGBA/core/cartridge/GPIO.js',
            'user_scripts/GfxGlueCode.js'
        ];
        var i = 0;
        function next(){
            if(i >= scripts.length){ iodineScriptsLoaded = true; cb(); return; }
            var s = document.createElement('script');
            s.src = BASE + scripts[i++];
            s.onload = next;
            s.onerror = function(e){ console.warn('Failed loading: ' + scripts[i-1]); next(); };
            document.head.appendChild(s);
        }
        next();
    }

    function stopGame(){
        isRunning = false;
        if(IodineGUI.coreTimerID){ clearInterval(IodineGUI.coreTimerID); IodineGUI.coreTimerID = null; }
        if(IodineGUI.Iodine){ try{ IodineGUI.Iodine.pause(); }catch(e){} }
        IodineGUI.Iodine = null; IodineGUI.Blitter = null; IodineGUI.isPlaying = false;
        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 240, 160);
    }

    function renderError(title, msg){
        document.getElementById('screen').classList.add('game-running');
        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');
        ctx.fillStyle='#050505'; ctx.fillRect(0,0,240,160);
        ctx.fillStyle='#ff4444'; ctx.font='bold 12px sans-serif'; ctx.fillText(title,8,70);
        ctx.fillStyle='#aaa'; ctx.font='9px monospace';
        var words = msg.split(' '), line = '', y = 88;
        for(var w=0;w<words.length;w++){ var t=line+(line?' ':'')+words[w]; if(ctx.measureText(t).width>224&&line){ctx.fillText(line,8,y);line=words[w];y+=12;}else line=t; }
        if(line) ctx.fillText(line,8,y);
    }

    function startIodine(biosBuffer, romBuffer){
        try {
            IodineGUI.Iodine = new GameBoyAdvanceEmulator();
            IodineGUI.Iodine.attachBIOS(new Uint8Array(biosBuffer));
            IodineGUI.Iodine.attachROM(new Uint8Array(romBuffer));
            IodineGUI.Blitter = new GfxGlueCode(240, 160);
            IodineGUI.Blitter.attachCanvas(document.getElementById('game-canvas'));
            IodineGUI.Iodine.attachGraphicsFrameHandler(IodineGUI.Blitter);
            IodineGUI.Iodine.setIntervalRate(8);
            IodineGUI.startTime = +(new Date()).getTime();
            IodineGUI.coreTimerID = setInterval(function(){
                IodineGUI.Iodine.timerCallback(((+(new Date()).getTime()) - IodineGUI.startTime) >>> 0);
            }, 8);
            IodineGUI.Iodine.play();
            isRunning = true;
        } catch(e){
            renderError('BOOT FAILED', String(e));
        }
    }

    function loadRom(romBuffer){
        stopGame();
        document.getElementById('screen').classList.add('game-running');
        document.getElementById('screen').classList.remove('os-ready');
        
        initDB().then(function(db){
            if(useMemoryFallback || !db) {
                if(!memoryStore.bios){ renderError('NO BIOS FOUND', 'Please insert a GBA BIOS core (.bin) via the Settings menu before playing.'); return; }
                loadIodineScripts(function(){ startIodine(memoryStore.bios, romBuffer); });
            } else {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var req = tx.objectStore(STORE_NAME).get('__bios__');
                req.onsuccess = function(){
                    if(!req.result){ renderError('NO BIOS FOUND', 'Please insert a GBA BIOS core (.bin) via the Settings menu before playing.'); return; }
                    loadIodineScripts(function(){
                        startIodine(req.result.data, romBuffer);
                    });
                };
            }
        }).catch(function(){ renderError('DB ERROR','Could not access storage.'); });
    }

    function handleInput(btnId, pressed){
        if(!isRunning || !IodineGUI.Iodine) return;
        var bit = btnBits[btnId];
        if(bit === undefined) return;
        if(pressed) IodineGUI.Iodine.keyDown(bit);
        else IodineGUI.Iodine.keyUp(bit);
    }

    // ===================== IndexedDB + Memory Fallback =====================
    var DB_NAME="GMX_GBA_Storage", STORE_NAME="library";
    var useMemoryFallback = false;
    var memoryStore = { bios: null, games: {} };

    function initDB(){
        return new Promise(function(resolve,reject){
            if(useMemoryFallback) return resolve(null);
            if(!window.indexedDB) { useMemoryFallback = true; return resolve(null); }
            try {
                var req=indexedDB.open(DB_NAME,1);
                req.onupgradeneeded=function(e){e.target.result.createObjectStore(STORE_NAME,{keyPath:"id"});};
                req.onsuccess=function(){resolve(req.result);};
                req.onerror=function(){useMemoryFallback=true; resolve(null);};
            } catch(e) {
                useMemoryFallback = true; resolve(null);
            }
        });
    }

    function saveBiosToDB(biosFile){
        return biosFile.arrayBuffer().then(function(buf){
            return initDB().then(function(db){
                if(useMemoryFallback || !db) {
                    memoryStore.bios = buf;
                    return Promise.resolve();
                }
                return new Promise(function(resolve,reject){
                    var tx=db.transaction(STORE_NAME,"readwrite");
                    tx.objectStore(STORE_NAME).put({id:'__bios__', data:buf});
                    tx.oncomplete=resolve; tx.onerror=reject;
                });
            });
        });
    }

    function saveGameToDB(romFile,imgFile){
        return initDB().then(function(db){
            return romFile.arrayBuffer().then(function(romBuffer){
                var coverPromise;
                if(imgFile){
                    coverPromise = new Promise(function(res){
                        var r=new FileReader();r.onload=function(e){res(e.target.result);};r.readAsDataURL(imgFile);
                    });
                } else {
                    coverPromise = Promise.resolve("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=");
                }
                return coverPromise.then(function(cover){
                    var id = romFile.name.replace(/\.[^/.]+$/,"");
                    var rec = {id:id, title:id, rom:romBuffer, cover:cover};
                    if(useMemoryFallback || !db) {
                        memoryStore.games[id] = rec;
                        return Promise.resolve();
                    }
                    return new Promise(function(resolve,reject){
                        var tx=db.transaction(STORE_NAME,"readwrite");
                        tx.objectStore(STORE_NAME).put(rec);
                        tx.oncomplete=resolve; tx.onerror=reject;
                    });
                });
            });
        });
    }

        var consoleEl=document.getElementById('gmx-console');
        if(!consoleEl||window.innerHeight>window.innerWidth)return;
        var s=Math.min((window.innerWidth*0.95)/735,(window.innerHeight*0.95)/350,1);

    // ===================== XMB OS =====================
    var isPoweredOn=false,isOSReady=false,colIdx=1,rowIdx=0;
    var maxRows=[1,1,1];

    function renderGameList(games) {
        var gameCol=document.getElementById('game-column');
        var memStick=document.getElementById('memory-stick');
        var old=document.querySelectorAll('.dynamic-game');
        for(var i=0;i<old.length;i++) old[i].remove();
        var nr=1;
        games.forEach(function(g){
            if(g.id === '__bios__') return;
            var d=document.createElement('div');
            d.className='xmb-sub game-item dynamic-game';
            d.innerHTML='<img src="'+g.cover+'" class="box-art"><div class="game-details"><span class="game-title">'+g.title+'</span></div>';
            gameCol.insertBefore(d,memStick);
            nr++;
        });
        maxRows[1]=nr;
    }

    function buildXMB(){
        return initDB().catch(function(){return null;}).then(function(db){
            return new Promise(function(resolve,reject){
                if(useMemoryFallback || !db) {
                    var gamesArr = [];
                    for(var key in memoryStore.games) gamesArr.push(memoryStore.games[key]);
                    renderGameList(gamesArr);
                    resolve();
                } else {
                    var tx=db.transaction(STORE_NAME,"readonly");
                    var req=tx.objectStore(STORE_NAME).getAll();
                    req.onsuccess=function(){
                        renderGameList(req.result||[]);
                        resolve();
                    };
                    req.onerror=function(){reject(req.error);};
                }
            });
        });
    }

    function updateXMB(){
        var gridEl=document.getElementById('xmb-grid');
        var colEls=document.querySelectorAll('.xmb-col');
        var sysMsgEl=document.getElementById('sys-msg');
        var bgLayer=document.getElementById('game-bg-layer');
        if(!isOSReady)return;
        gridEl.style.transform='translate(calc(-50% + '+((1-colIdx)*100)+'px), '+(-rowIdx*60)+'px)';
        colEls.forEach(function(col,c){
            if(c===colIdx){col.classList.add('active-col');var ch=col.children;for(var r=0;r<ch.length;r++)ch[r].classList.toggle('active-item',r===rowIdx);}
            else{col.classList.remove('active-col');var ch2=col.children;for(var r2=0;r2<ch2.length;r2++)ch2[r2].classList.remove('active-item');}
        });
        var ai=document.querySelector('.active-col .active-item.dynamic-game img');
        if(ai){bgLayer.style.backgroundImage='linear-gradient(to right,rgba(15,16,26,0.95) 0%,rgba(15,16,26,0.5) 60%,rgba(0,0,0,0) 100%),url('+ai.src+')';bgLayer.style.opacity=1;}
        else bgLayer.style.opacity=0;
        var gi=document.querySelectorAll('.dynamic-game');
        if(colIdx===1&&rowIdx>0&&rowIdx<=gi.length){sysMsgEl.innerText="(B) Delete Game";sysMsgEl.style.opacity=1;}
        else{sysMsgEl.innerText="";sysMsgEl.style.opacity=0;}
    }

    // ===================== Input Manager =====================
    var navLeft=function(){if(colIdx>0&&isOSReady&&!document.getElementById('install-popup').classList.contains('visible')){colIdx--;rowIdx=0;updateXMB();}};
    var navRight=function(){if(colIdx<2&&isOSReady&&!document.getElementById('install-popup').classList.contains('visible')){colIdx++;rowIdx=0;updateXMB();}};
    var navUp=function(){if(rowIdx>0&&isOSReady&&!document.getElementById('install-popup').classList.contains('visible')){rowIdx--;updateXMB();}};
    var navDown=function(){if(rowIdx<maxRows[colIdx]&&isOSReady&&!document.getElementById('install-popup').classList.contains('visible')){rowIdx++;updateXMB();}};

    var interactable=['btn-up','btn-down','btn-left','btn-right','btn-a','btn-b','btn-select','btn-start','btn-l','btn-r'];
    var active=new Set();

    function triggerA(){
        var screenEl=document.getElementById('screen');
        var sysMsgEl=document.getElementById('sys-msg');
        if(!isOSReady||document.getElementById('install-popup').classList.contains('visible'))return;
        if(colIdx===1){
            var games=document.querySelectorAll('.dynamic-game');
            if(rowIdx>0&&rowIdx<=games.length){
                var title=games[rowIdx-1].querySelector('.game-title').innerText;
                sysMsgEl.innerText="BOOTING: "+title;sysMsgEl.style.opacity=1;
                initDB().then(function(db){
                    if(useMemoryFallback || !db) {
                        var g = memoryStore.games[title];
                        if(!g){sysMsgEl.innerText="ROM not found.";return;}
                        loadRom(g.rom);
                    } else {
                        var tx=db.transaction(STORE_NAME,"readonly");
                        var req2=tx.objectStore(STORE_NAME).get(title);
                        req2.onsuccess=function(){
                            if(!req2.result){sysMsgEl.innerText="ROM not found.";return;}
                            loadRom(req2.result.rom);
                        };
                    }
                }).catch(function(){sysMsgEl.innerText="Error loading game.";});
            } else if(rowIdx===games.length+1){ openPopup(); }
        } else if(colIdx===0){ openBiosPopup(); } else { sysMsgEl.innerText="Module offline.";sysMsgEl.style.opacity=1; }
    }

    function triggerB_OS(){
        var screenEl=document.getElementById('screen');
        var sysMsgEl=document.getElementById('sys-msg');
        if(document.getElementById('install-popup').classList.contains('visible')){closePopup();return;}
        if(!isOSReady||screenEl.classList.contains('game-running'))return;
        if(colIdx!==1)return;
        var gi=document.querySelectorAll('.dynamic-game');
        if(rowIdx<1||rowIdx>gi.length)return;
        var title=gi[rowIdx-1].querySelector('.game-title').innerText;
        sysMsgEl.innerText='Deleting '+title+'...';sysMsgEl.style.opacity=1;
        initDB().then(function(db){
            if(useMemoryFallback || !db) {
                delete memoryStore.games[title];
                return Promise.resolve();
            } else {
                var tx=db.transaction(STORE_NAME,"readwrite");
                tx.objectStore(STORE_NAME).delete(title);
                return new Promise(function(res,rej){tx.oncomplete=res;tx.onerror=rej;});
            }
        }).then(buildXMB).then(function(){rowIdx=Math.min(rowIdx,maxRows[1]-1);updateXMB();sysMsgEl.style.opacity=0;}).catch(function(){});
    }

    function getInteractableId(el){
        while(el){
            if(el.id && interactable.indexOf(el.id)!==-1) return el.id;
            el=el.parentElement;
        }
        return null;
    }

    function pressButton(id){
        var screenEl=document.getElementById('screen');
        if(active.has(id)) return;
        active.add(id);
        var el=document.getElementById(id);
        if(el) el.classList.add('pressed');
        if(screenEl.classList.contains('game-running')){
            handleInput(id,true);
        } else {
            if(id==='btn-left')navLeft();
            if(id==='btn-right')navRight();
            if(id==='btn-up')navUp();
            if(id==='btn-down')navDown();
            if(id==='btn-a')triggerA();
            if(id==='btn-b')triggerB_OS();
        }
    }

    function releaseButton(id){
        var screenEl=document.getElementById('screen');
        if(!active.has(id)) return;
        active.delete(id);
        var el=document.getElementById(id);
        if(el) el.classList.remove('pressed');
        if(screenEl.classList.contains('game-running')) handleInput(id,false);
    }

    function releaseAll(){
        Array.from(active).forEach(releaseButton);
    }

    // Touch: track which touch ID maps to which button
    var touchMap={};

    // Disable standard mobile context menus that block touch inputs on hold
    window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    function onTouchStart(e){
        var tag=e.target.tagName;
        if(tag!=='INPUT'&&tag!=='LABEL'&&tag!=='BUTTON') e.preventDefault();
        for(var i=0;i<e.changedTouches.length;i++){
            var t=e.changedTouches[i];
            var id=getInteractableId(document.elementFromPoint(t.clientX,t.clientY));
            if(id){ touchMap[t.identifier]=id; pressButton(id); }
        }
    }
    function onTouchMove(e){
        var tag=e.target.tagName;
        if(tag!=='INPUT'&&tag!=='LABEL'&&tag!=='BUTTON') e.preventDefault();
        for(var i=0;i<e.changedTouches.length;i++){
            var t=e.changedTouches[i];
            var newId=getInteractableId(document.elementFromPoint(t.clientX,t.clientY));
            var oldId=touchMap[t.identifier];
            if(oldId!==newId){
                if(oldId) releaseButton(oldId);
                if(newId){ touchMap[t.identifier]=newId; pressButton(newId); }
                else delete touchMap[t.identifier];
            }
        }
    }
    function onTouchEnd(e){
        for(var i=0;i<e.changedTouches.length;i++){
            var t=e.changedTouches[i];
            var id=touchMap[t.identifier];
            if(id){ releaseButton(id); delete touchMap[t.identifier]; }
        }
    }
    window.addEventListener('touchstart',onTouchStart,{passive:false});
    window.addEventListener('touchmove',onTouchMove,{passive:false});
    window.addEventListener('touchend',onTouchEnd,{passive:false});
    window.addEventListener('touchcancel',onTouchEnd,{passive:false});

    // Mouse
    var mouseHeld=null;
    window.addEventListener('mousedown',function(e){
        var tag=e.target.tagName;
        if(tag!=='INPUT'&&tag!=='LABEL'&&tag!=='BUTTON') e.preventDefault();
        var id=getInteractableId(e.target);
        if(id){ mouseHeld=id; pressButton(id); }
    });
    window.addEventListener('mousemove',function(e){
        if(!mouseHeld) return;
        var id=getInteractableId(document.elementFromPoint(e.clientX,e.clientY));
        if(id!==mouseHeld){ releaseButton(mouseHeld); mouseHeld=id||null; if(mouseHeld) pressButton(mouseHeld); }
    });
    window.addEventListener('mouseup',function(){ if(mouseHeld){ releaseButton(mouseHeld); mouseHeld=null; } });
    window.addEventListener('mouseleave',function(){ if(mouseHeld){ releaseButton(mouseHeld); mouseHeld=null; } });

    // ===================== POWER =====================
    var bootTimers=[];
    function togglePower(e){
        var screenEl=document.getElementById('screen');
        var bootCont=document.getElementById('boot-logo-container');
        var sysMsgEl=document.getElementById('sys-msg');
        if(e)e.preventDefault();
        isPoweredOn=!isPoweredOn;isOSReady=false;
        bootTimers.forEach(clearTimeout);bootTimers=[];
        if(isPoweredOn){
            document.getElementById('power-led').classList.add('is-on');
            screenEl.classList.add('boot-white');
            bootTimers.push(setTimeout(function(){bootCont.classList.add('do-drop');},200));
            bootTimers.push(setTimeout(function(){document.getElementById('boot-gmx').classList.add('do-glint');document.getElementById('boot-reg').classList.add('do-fade-in');},1000));
            bootTimers.push(setTimeout(function(){bootCont.classList.add('do-fade-out');},3000));
            bootTimers.push(setTimeout(function(){
                buildXMB().catch(function(){}).then(function(){
                    screenEl.classList.remove('boot-white');screenEl.classList.add('os-ready');isOSReady=true;colIdx=1;rowIdx=0;updateXMB();
                });
            },3500));
        } else {
            document.getElementById('power-led').classList.remove('is-on');
            screenEl.className='';bootCont.classList.remove('do-drop','do-fade-out');
            document.getElementById('boot-gmx').classList.remove('do-glint');document.getElementById('boot-reg').classList.remove('do-fade-in');
            sysMsgEl.style.opacity=0;stopGame();closePopup();
        }
    }
    document.getElementById('btn-power').addEventListener('click',togglePower);
    document.getElementById('btn-power').addEventListener('touchstart',togglePower,{passive:false});

    // ===================== CLOCK =====================
    function updateClock(){
        var now=new Date(),mo=now.getMonth()+1,da=now.getDate();
        var h=now.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;
        var mi=now.getMinutes().toString().padStart(2,'0');
        var c=document.getElementById('xmb-clock');if(c)c.innerText=mo+'/'+da+' '+h+':'+mi+ap;
    }
    updateClock();setInterval(updateClock,1000);

    // iOS audio unlock
    window.addEventListener('touchstart',function(){try{var ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}},{once:true,passive:true});

    // Init
    applyScale();
    document.getElementById('loading-overlay').classList.add('hidden');
    </script>
</body>
</html>
