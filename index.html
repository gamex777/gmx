<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMX Emulator</title>
    <style>
        /* --- BASE RESET & SETUP --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body { 
            background-color: #111; display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; overflow: hidden; perspective: 1000px; 
            /* Century Gothic Font */
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif; 
        }
        
        #rotate-message { display: none; color: #fff; font-size: 1.5rem; text-align: center; font-weight: bold; letter-spacing: 2px; }
        @media (orientation: portrait) { #gmx-console { display: none !important; } #rotate-message { display: block; } }

        /* --- CONSOLE SHELL (Perfect Scaling) --- */
        @media (orientation: landscape) {
            #gmx-console {
                position: relative; display: flex; justify-content: center; align-items: center;
                width: 1080px; height: 500px; background-color: #18c2c1; border-radius: 44px;
                box-shadow: inset 0 0 40px rgba(0,0,0,0.1), inset 5px 5px 10px rgba(255,255,255,0.15), -5px -5px 15px rgba(0,0,0,0.3), 10px 10px 30px rgba(0,0,0,0.7);
                overflow: hidden; transform-origin: center center; 
            }

            #screen-bezel {
                position: absolute; width: 60%; height: 84%; background: #000; border-radius: 16px;
                box-shadow: inset 0 0 10px rgba(255,255,255,0.05), inset 0 0 20px rgba(0,0,0,1), 0 10px 20px rgba(0,0,0,0.5);
                z-index: 10; padding: 4px; 
            }

            /* --- SCREEN LAYERS --- */
            #screen {
                position: relative; width: 100%; height: 100%; background: #050505; border-radius: 12px;
                box-shadow: inset 0 0 30px rgba(0,0,0,1); transition: background 0.5s ease; overflow: hidden;
                display: flex; justify-content: center; align-items: center;
            }

            /* 1. GBA Boot Sequence */
            #screen.boot-white { background: #ffffff; box-shadow: inset 0 0 15px rgba(0,0,0,0.2); }
            #boot-logo-container { position: absolute; display: flex; align-items: flex-start; opacity: 0; z-index: 20; }
            #boot-gmx { font-size: 3.5rem; font-weight: 900; font-style: italic; letter-spacing: -2px; background: linear-gradient(to bottom, #3b2d9b 0%, #6641b5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; }
            #boot-reg { font-size: 0.9rem; font-weight: bold; color: #3b2d9b; margin-top: 8px; margin-left: 4px; opacity: 0; }
            #boot-gmx::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-20deg); pointer-events: none; }

            @keyframes gbaDrop { 0% { transform: translateY(-80px) scale(1.1); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
            @keyframes glintSweep { 0% { left: -150%; } 100% { left: 200%; } }
            @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1); } }
            @keyframes fadeOut { 100% { opacity: 0; } }

            .do-drop { animation: gbaDrop 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
            .do-glint::after { animation: glintSweep 0.5s ease-in-out forwards; }
            .do-fade-in { animation: fadeIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
            .do-fade-out { animation: fadeOut 0.5s ease forwards; }

            /* 2. PSP XMB OS Layer */
            .xmb-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; background: linear-gradient(135deg, #3b3c63 0%, #2b2c4e 50%, #1e1f3a 100%); z-index: 1; }
            .xmb-game-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center right; opacity: 0; transition: opacity 0.4s ease; z-index: -1; }
            
            .wave-line { position: absolute; width: 150%; height: 150px; background: rgba(255,255,255,0.03); border-top: 2px solid rgba(255,255,255,0.15); border-radius: 50%; top: 30%; left: -25%; transform: rotate(-8deg); }
            .wave-line:nth-child(3) { top: 40%; transform: rotate(5deg) scaleY(1.2); border-top: 1px solid rgba(255,255,255,0.2); }

            #xmb-ui { position: absolute; width: 100%; height: 100%; z-index: 10; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; color: #fff; }
            #screen.os-ready .xmb-bg { opacity: 1; }
            #screen.os-ready #xmb-ui { opacity: 1; pointer-events: auto; }

            #xmb-header { position: absolute; top: 8%; right: 4%; font-size: 1rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 8px; }
            .battery-icon { width: 24px; height: 12px; border: 2px solid #fff; border-radius: 2px; position: relative; }
            .battery-icon::after { content: ''; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: #fff; }
            .battery-fill { width: 100%; height: 100%; background: #fff; border: 1px solid transparent; background-clip: content-box; }

            #xmb-grid { position: absolute; top: 40%; left: 50%; display: flex; gap: 100px; transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
            .xmb-col { display: flex; flex-direction: column; align-items: center; gap: 40px; transition: opacity 0.25s, transform 0.25s; opacity: 0.4; transform: scale(0.85); }
            .xmb-col.active-col { opacity: 1; transform: scale(1); }

            .xmb-main { position: relative; display: flex; justify-content: center; align-items: center; transition: all 0.2s; }
            .xmb-icon { width: 50px; height: 50px; fill: #ffffff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); transition: all 0.2s; }
            .xmb-main span { position: absolute; left: 130%; top: 50%; transform: translateY(-50%); font-size: 1.1rem; white-space: nowrap; opacity: 0; transition: opacity 0.2s; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
            .active-col .active-item.xmb-main .xmb-icon { transform: scale(1.3); filter: drop-shadow(0 0 15px rgba(255,255,255,0.9)); }
            .active-col .active-item.xmb-main span { opacity: 1; }
            
            .xmb-sub { font-size: 1.1rem; opacity: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); transition: all 0.2s; white-space: nowrap; }
            .active-col .xmb-sub { opacity: 0.6; }
            .active-col .active-item.xmb-sub { opacity: 1; transform: scale(1.15); }
            
            /* DYNAMIC GAME LIST ITEM */
            .game-item { display: flex; align-items: center; justify-content: center; position: relative; }
            .box-art { width: 75px; height: 50px; object-fit: cover; border: 2px solid transparent; border-radius: 4px; transition: all 0.2s; }
            .active-col .active-item.game-item .box-art { border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.8); transform: scale(1.1); }
            .game-details { position: absolute; left: 100px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; opacity: 0; transition: opacity 0.2s; }
            .active-col .active-item.game-item .game-details { opacity: 1; }
            .game-title { font-size: 0.95rem; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
            .download-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.8); padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); transition: all 0.2s; }

            #sys-msg { position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; }

            /* 3. GAME CANVAS LAYER */
            #game-canvas {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 100%; height: 100%; object-fit: contain; 
                image-rendering: pixelated; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
            }
            #screen.game-running #game-canvas { opacity: 1; pointer-events: auto; }
            #screen.game-running #xmb-ui { opacity: 0; pointer-events: none; }
            #screen.game-running .xmb-bg { opacity: 0; }

            /* --- CONTROLS CSS --- */
            .shoulder-group { position: absolute; top: 7%; display: flex; gap: 15px; }
            .left-shoulder { left: 10%; transform: translateX(-50%); } .right-shoulder { right: 10%; transform: translateX(50%); }
            .btn-shoulder { background: linear-gradient(#2a2a2a 0%, #1a1a1a 100%); color: #c0c0c0; border-radius: 18px; padding: 10px 28px; font-size: 0.8rem; font-weight: 700; box-shadow: inset 0 2px 2px rgba(255,255,255,0.1), inset 0 -2px 3px rgba(0,0,0,0.7), 0 4px 6px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s ease-out; }
            .btn-shoulder:active, .btn-shoulder.pressed { background: linear-gradient(#151515 0%, #0a0a0a 100%); transform: translateY(2px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), inset 0 -1px 2px rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.3); color: #909090; }

            .control-base { position: absolute; top: 32%; width: 17%; aspect-ratio: 1; background: radial-gradient(circle at 30% 30%, #b0b8ff 0%, #909bff 50%, #858eee 100%); border: 3px solid #111; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 2px 5px rgba(255,255,255,0.1), inset 0 -2px 10px rgba(0,0,0,0.5), 0 5px 15px rgba(0,0,0,0.4); }
            .left-base { left: 10%; transform: translateX(-50%); } .right-base { right: 10%; transform: translateX(50%); }

            .d-pad-cross { position: relative; width: 80%; height: 80%; background: linear-gradient(#2d2d2d 0%, #1a1a1a 100%); border-radius: 50%; box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 3px 6px rgba(0,0,0,0.6); }
            .d-btn { position: absolute; width: 28%; height: 32%; cursor: pointer; background: #1a1a1a; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; transition: filter 0.1s; }
            .d-btn.pressed { background: #111; filter: brightness(0.7); }
            .d-up { top: 7%; left: 36%; border-radius: 6px 6px 12px 12px; } .d-right { top: 34%; right: 7%; border-radius: 12px 6px 6px 12px; height: 28%; width: 32%;} .d-down { bottom: 7%; left: 36%; border-radius: 12px 12px 6px 6px; } .d-left { top: 34%; left: 7%; border-radius: 6px 12px 12px 6px; height: 28%; width: 32%;}
            .d-btn::before { content: ''; width: 0; height: 0; position: absolute; }
            .d-up::before { border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid rgba(255,255,255,0.6); border-top: 8px solid rgba(0,0,0,0.3); top: 25%; } .d-right::before { border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid rgba(255,255,255,0.6); border-right: 8px solid rgba(0,0,0,0.3); right: 25%; } .d-down::before { border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid rgba(255,255,255,0.6); border-bottom: 8px solid rgba(0,0,0,0.3); bottom: 25%; } .d-left::before { border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid rgba(255,255,255,0.6); border-left: 8px solid rgba(0,0,0,0.3); left: 25%; }

            .action-pad-cluster { position: relative; width: 85%; height: 85%; }
            .btn-action { position: absolute; width: 32%; height: 32%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 30%, #b0b0b0 80%, #999999 100%); box-shadow: inset -3px -3px 8px rgba(0,0,0,0.4), inset 2px 2px 6px rgba(255,255,255,0.8), 0 6px 8px rgba(0,0,0,0.6); color: #222; font-weight: 700; font-size: 1rem; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
            .btn-action.pressed { transform: translateY(4px); box-shadow: inset -1px -1px 4px rgba(0,0,0,0.4), inset 1px 1px 4px rgba(255,255,255,0.8), 0 2px 2px rgba(0,0,0,0.6); background: radial-gradient(circle at 35% 35%, #e8e8e8 0%, #c0c0c0 30%, #909090 80%, #777777 100%); }
            .btn-y { top: 4%; left: 34%; } .btn-b { top: 34%; right: 4%; } .btn-a { bottom: 4%; left: 34%; } .btn-x { top: 34%; left: 4%; }

            .analog-stick { position: absolute; width: 8%; aspect-ratio: 1; background: linear-gradient(#0c0c0c 0%, #151515 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 10px 30px rgba(0,0,0,1), inset 0 2px 2px rgba(255,255,255,0.05), 0 2px 5px rgba(0,0,0,0.4); bottom: 9%; z-index: 20; }
            .left-analog { left: 10%; transform: translateX(-50%); } .right-analog { right: 10%; transform: translateX(50%); }
            .stick-cap { width: 75%; height: 75%; background: radial-gradient(circle at 40% 40%, #eef1ff 0%, #c8d1ed 50%, #a8b1dd 100%); border-radius: 50%; box-shadow: inset 2px 2px 2px rgba(255,255,255,0.3), inset -5px -5px 15px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.5); cursor: grab; background-image: repeating-radial-gradient(circle, transparent 0%, transparent 6%, rgba(0,0,0,0.02) 7%, rgba(0,0,0,0.02) 8%), radial-gradient(circle at 40% 40%, #eef1ff 0%, #c8d1ed 50%, #a8b1dd 100%); }
            .stick-cap::before { content:''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }

            #gmx-logo { position: absolute; bottom: 2%; left: 50%; transform: translateX(-50%); color: #000; font-size: 1.1rem; font-style: italic; font-weight: 700; letter-spacing: -1px; opacity: 0.8; text-shadow: 1px 1px 1px rgba(255,255,255,0.1); }
            .bottom-btn { position: absolute; bottom: 2%; background: #000; color: #ccc; border-radius: 10px; padding: 4px 12px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; box-shadow: inset 0 -1px 3px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.3); cursor: pointer; }
            .bottom-btn.pressed { box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); transform: translateY(1px); }
            .select-btn { left: 35%; } .start-btn { right: 35%; } .power-btn { right: 20%; }

            .led-indicator { position: absolute; bottom: 3.2%; right: 27.5%; width: 8px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #5a3a3a 0%, #2a1010 100%); box-shadow: inset 0 1px 3px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.1); transition: background 0.1s ease, box-shadow 0.1s ease; }
            .led-indicator.is-on { background: radial-gradient(circle at 40% 40%, #e0ffff 0%, #00ffcc 50%, #008866 100%); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 8px #00ffcc, 0 0 15px rgba(0,255,204,0.4); }
        }
    </style>
</head>

    <script>
        // --- 1. GMX EMULATOR BRIDGE ---
        class GMXEmulatorBridge {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.isRunning = false;
                this.animFrame = null;
                
                // Digital Buttons Map
                this.inputMap = {
                    'btn-up': 0, 'btn-down': 1, 'btn-left': 2, 'btn-right': 3,
                    'btn-a': 4, 'btn-b': 5, 'btn-x': 6, 'btn-y': 7,
                    'btn-l1': 8, 'btn-r1': 9, 'btn-start': 10, 'btn-select': 11
                };
            }

            loadRomData(arrayBuffer, filename) {
                console.log(`Bridge: Ingesting ${filename} (${arrayBuffer.byteLength} bytes)`);
                this.isRunning = true;
                this.testRenderLoop(); 
            }

            // Digital Button Input
            handleInput(domId, isPressed) {
                if (!this.isRunning) return;
                const coreBtn = this.inputMap[domId];
                if (coreBtn !== undefined) {
                    console.log(`Core Digital Input: [${domId}] -> ${isPressed ? 'DOWN' : 'UP'}`);
                }
            }

            // Independent Analog Joystick Input
            handleAnalog(stickId, nx, ny) {
                if (!this.isRunning) return;
                console.log(`Core Analog Input: [${stickId}] -> X: ${nx.toFixed(2)}, Y: ${ny.toFixed(2)}`);
            }

            stop() {
                this.isRunning = false; cancelAnimationFrame(this.animFrame);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            testRenderLoop() {
                if (!this.isRunning) return;
                const time = Date.now() * 0.002;
                const w = this.canvas.width, h = this.canvas.height;
                const imgData = this.ctx.createImageData(w, h);
                for(let y=0; y<h; y++) {
                    for(let x=0; x<w; x++) {
                        const i = (y * w + x) * 4;
                        imgData.data[i] = (Math.sin(x*0.05 + time) * 127 + 128);
                        imgData.data[i+1] = (Math.cos(y*0.05 + time) * 127 + 128);
                        imgData.data[i+2] = (Math.sin((x+y)*0.05) * 127 + 128);
                        imgData.data[i+3] = 255;
                    }
                }
                this.ctx.putImageData(imgData, 0, 0);
                this.ctx.fillStyle = 'white'; this.ctx.font = '20px sans-serif';
                this.ctx.fillText("CORE HOOKED UP", 40, h/2);
                this.ctx.fillText("WAITING FOR ENGINE...", 30, h/2 + 30);
                this.animFrame = requestAnimationFrame(() => this.testRenderLoop());
            }
        }
        const gmxBridge = new GMXEmulatorBridge('game-canvas');

        // --- 2. DYNAMIC SCALING ---
        let currentScale = 1;
        const consoleEl = document.getElementById('gmx-console');
        const applyScale = () => {
            if (window.innerHeight > window.innerWidth) return;
            const winW = window.innerWidth, winH = window.innerHeight;
            currentScale = Math.min((winW * 0.95) / 1080, (winH * 0.95) / 500);
            consoleEl.style.transform = `scale(${currentScale})`;
        };
        window.addEventListener('resize', applyScale);
        applyScale();

        // --- 3. XMB STATE & NAV ---
        let isPoweredOn = false, isOSReady = false, colIdx = 1, rowIdx = 0; 
        const maxRows = [1, 2, 1]; // Updated row limits mapping to Settings, Game, About
        const grid = document.getElementById('xmb-grid');
        const cols = document.querySelectorAll('.xmb-col');
        const sysMsg = document.getElementById('sys-msg');
        const screen = document.getElementById('screen');
        
        const updateXMB = () => {
            if(!isOSReady) return;
            grid.style.transform = `translate(calc(-50% + ${(1 - colIdx) * 100}px), ${-rowIdx * 60}px)`;
            
            cols.forEach((col, c) => {
                if (c === colIdx) {
                    col.classList.add('active-col');
                    Array.from(col.children).forEach((item, r) => item.classList.toggle('active-item', r === rowIdx));
                } else {
                    col.classList.remove('active-col');
                    Array.from(col.children).forEach(item => item.classList.remove('active-item'));
                }
            });

            // Dynamic Game Background Crossfade
            const gameBgLayer = document.getElementById('game-bg-layer');
            if (colIdx === 1 && rowIdx === 1) {
                gameBgLayer.style.backgroundImage = `linear-gradient(to right, rgba(30,31,58,0.95) 0%, rgba(30,31,58,0.4) 60%, rgba(0,0,0,0) 100%), url('https://lh3.googleusercontent.com/d/1nYNL-SgSK_5vDP74DB1XKI61nTYIv0yq')`;
                gameBgLayer.style.opacity = 1;
            } else {
                gameBgLayer.style.opacity = 0;
            }

            sysMsg.style.opacity = 0; 
        };

        // --- 4. BUTTON BINDING (Digital UI) ---
        const bindInput = (id, navAction) => {
            const el = document.getElementById(id);
            const trigger = (e) => { 
                e.preventDefault(); el.classList.add('pressed'); 
                if (screen.classList.contains('game-running')) gmxBridge.handleInput(id, true);
                else if (navAction) navAction();
            };
            const release = (e) => { 
                e.preventDefault(); el.classList.remove('pressed'); 
                if (screen.classList.contains('game-running')) gmxBridge.handleInput(id, false);
            };
            el.addEventListener('mousedown', trigger); el.addEventListener('touchstart', trigger, {passive: false});
            el.addEventListener('mouseup', release); el.addEventListener('touchend', release); el.addEventListener('mouseleave', release);
        };

        const navLeft = () => { if(colIdx > 0 && isOSReady) { colIdx--; rowIdx = 0; updateXMB(); } };
        const navRight = () => { if(colIdx < 2 && isOSReady) { colIdx++; rowIdx = 0; updateXMB(); } };
        const navUp = () => { if(rowIdx > 0 && isOSReady) { rowIdx--; updateXMB(); } };
        const navDown = () => { if(rowIdx < maxRows[colIdx] && isOSReady) { rowIdx++; updateXMB(); } };

        bindInput('btn-left', navLeft); bindInput('btn-right', navRight); bindInput('btn-up', navUp); bindInput('btn-down', navDown);
        bindInput('btn-b', null); bindInput('btn-x', null); bindInput('btn-y', null);
        bindInput('btn-l1', null); bindInput('btn-l2', null); bindInput('btn-r1', null); bindInput('btn-r2', null);
        bindInput('btn-start', null); bindInput('btn-select', null);

        let isSnesDownloaded = false;
        const romUpload = document.getElementById('rom-upload');
        
        bindInput('btn-a', () => {
            if(!isOSReady) return;
            if (colIdx === 1 && rowIdx === 1) { 
                // Download and Play Offline Logic for the specific game
                if (!isSnesDownloaded) {
                    sysMsg.innerText = "Downloading to Local Cache..."; sysMsg.style.opacity = 1;
                    const btn = document.getElementById('snes-download-btn');
                    btn.innerText = "Downloading...";
                    setTimeout(() => {
                        isSnesDownloaded = true;
                        btn.innerText = "▶ Play Offline";
                        btn.style.background = "rgba(0, 255, 100, 0.2)";
                        btn.style.borderColor = "#0f0";
                        sysMsg.innerText = "Download Complete. Ready to launch.";
                    }, 2000);
                } else {
                    sysMsg.innerText = "BOOTING: Super Mario Advance 2"; sysMsg.style.opacity = 1;
                    setTimeout(() => {
                        screen.classList.add('game-running');
                        screen.classList.remove('os-ready');
                        gmxBridge.loadRomData(new ArrayBuffer(0), "Super Mario Advance 2.gba"); 
                    }, 800);
                }
            } else if (colIdx === 1 && rowIdx === 2) { 
                // Manual Upload from Memory
                sysMsg.innerText = "Accessing Memory..."; sysMsg.style.opacity = 1;
                setTimeout(() => romUpload.click(), 300); 
            } else { 
                sysMsg.innerText = "Module offline."; sysMsg.style.opacity = 1; 
            }
        });

        romUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            sysMsg.innerText = `BOOTING: ${file.name}`;
            sysMsg.style.opacity = 1;
            const reader = new FileReader();
            reader.onload = (event) => {
                screen.classList.add('game-running');
                screen.classList.remove('os-ready');
                gmxBridge.loadRomData(event.target.result, file.name);
            };
            reader.readAsArrayBuffer(file);
        });

        // --- 5. POWER LOGIC ---
        const btnPower = document.getElementById('btn-power'), bootContainer = document.getElementById('boot-logo-container');
        let bootTimers = [];
        const togglePower = (e) => {
            if(e) e.preventDefault();
            isPoweredOn = !isPoweredOn; isOSReady = false;
            bootTimers.forEach(t => clearTimeout(t)); bootTimers = [];
            if(isPoweredOn) {
                document.getElementById('power-led').classList.add('is-on');
                screen.classList.add('boot-white'); 
                bootTimers.push(setTimeout(() => bootContainer.classList.add('do-drop'), 200));
                bootTimers.push(setTimeout(() => { document.getElementById('boot-gmx').classList.add('do-glint'); document.getElementById('boot-reg').classList.add('do-fade-in'); }, 1000));
                bootTimers.push(setTimeout(() => bootContainer.classList.add('do-fade-out'), 3000));
                bootTimers.push(setTimeout(() => { screen.classList.remove('boot-white'); screen.classList.add('os-ready'); isOSReady = true; colIdx = 1; rowIdx = 0; updateXMB(); }, 3500));
            } else {
                document.getElementById('power-led').classList.remove('is-on');
                screen.className = ''; bootContainer.classList.remove('do-drop', 'do-fade-out');
                document.getElementById('boot-gmx').classList.remove('do-glint'); document.getElementById('boot-reg').classList.remove('do-fade-in');
                sysMsg.style.opacity = 0; gmxBridge.stop();
            }
        };
        btnPower.addEventListener('click', togglePower); btnPower.addEventListener('touchstart', togglePower, {passive: false});

        // --- 6. INDEPENDENT ANALOG JOYSTICK PHYSICS ---
        const initJoystick = (socketId, capId, isLeftStick) => {
            const socket = document.getElementById(socketId), cap = document.getElementById(capId);
            let isDragging = false, originX, originY, maxRad, touchId = null, navInt = null, curDir = null;
            
            const executeNav = (dir) => {
                if (screen.classList.contains('game-running')) return; 
                if (isOSReady) {
                    if (dir === 'left') navLeft();
                    if (dir === 'right') navRight();
                    if (dir === 'up') navUp();
                    if (dir === 'down') navDown();
                }
            };

            const trigNav = (dir) => { if (curDir === dir) return; curDir = dir; clearInterval(navInt); executeNav(dir); navInt = setInterval(() => executeNav(dir), 200); };
            const stopNav = () => { clearInterval(navInt); navInt = null; curDir = null; };
            
            const startDrag = (e) => { 
                isDragging = true; cap.style.transition = 'none'; 
                const r = socket.getBoundingClientRect(); originX = r.left + r.width/2; originY = r.top + r.height/2; 
                maxRad = (socket.offsetWidth/2) - (cap.offsetWidth/2) + 5; 
                if (e.type === 'touchstart') { touchId = e.changedTouches[0].identifier; move(e.changedTouches[0]); } else move(e); 
            };

            const move = (e) => {
                let dx = (e.clientX - originX) / currentScale, dy = (e.clientY - originY) / currentScale; 
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxRad) { dx *= maxRad/dist; dy *= maxRad/dist; }
                cap.style.transform = `translate(${dx}px, ${dy}px) rotateX(${dy/maxRad*-15}deg) rotateY(${dx/maxRad*15}deg)`;
                
                if (screen.classList.contains('game-running')) {
                    gmxBridge.handleAnalog(isLeftStick ? 'left-stick' : 'right-stick', dx/maxRad, dy/maxRad);
                } 
                else if (isOSReady) {
                    if (dist > maxRad * 0.6) {
                        const ang = Math.atan2(dy, dx) * (180/Math.PI);
                        trigNav(ang >= -45 && ang <= 45 ? 'right' : ang > 45 && ang < 135 ? 'down' : ang < -45 && ang > -135 ? 'up' : 'left');
                    } else if (dist < maxRad * 0.2) stopNav();
                }
            };

            const handleDrag = (e) => { if (!isDragging) return; if (e.type === 'touchmove') { for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchId) { move(e.changedTouches[i]); break; } } else move(e); };
            
            const stopDrag = () => { 
                isDragging = false; touchId = null; stopNav(); 
                cap.style.transition = 'transform 0.1s linear'; cap.style.transform = 'translate(0px, 0px)'; 
                if (screen.classList.contains('game-running')) {
                    gmxBridge.handleAnalog(isLeftStick ? 'left-stick' : 'right-stick', 0, 0);
                }
            };
            
            cap.addEventListener('mousedown', startDrag); cap.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', handleDrag); window.addEventListener('touchmove', handleDrag, {passive: false});
            window.addEventListener('mouseup', stopDrag); window.addEventListener('touchend', stopDrag); window.addEventListener('mouseleave', stopDrag);
        };
        
        initJoystick('joystick-socket-left', 'joystick-cap-left', true);
        initJoystick('joystick-socket-right', 'joystick-cap-right', false);

        document.addEventListener('touchmove', e => { if(e.target.tagName !== 'INPUT') e.preventDefault(); }, {passive: false});

        // --- 7. LIVE SYSTEM CLOCK ---
        const updateClock = () => {
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12; 
            const minutes = now.getMinutes().toString().padStart(2, '0');
            
            const clockEl = document.getElementById('xmb-clock');
            if (clockEl) clockEl.innerText = `${month}/${date} ${hours}:${minutes}${ampm}`;
        };
        
        updateClock();
        setInterval(updateClock, 1000); 

    </script>
</body>
