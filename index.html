<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MicroEmu</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MicroEmu">
<link rel="apple-touch-icon" href="icon.png">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/util.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/core.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/arm.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/thumb.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/mmu.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/io.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/audio.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/video.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/video/proxy.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/video/software.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/irq.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/keypad.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/sio.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/savedata.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/gpio.js"></script>
<script src="https://cdn.jsdelivr.net/gh/endrift/gbajs@master/js/gba.js"></script>

<style>
    /* -----------------------------------------
       1. Base Setup & Console Body
       ----------------------------------------- */
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background-color: #2c2c2c; overflow: hidden; font-family: Arial, sans-serif;
    }
    .console-body {
        width: 100vw; max-width: 900px; height: 45.45vw; max-height: 409px; 
        background-color: #f67a76; border-radius: 50px; 
        box-shadow: 12px 18px 25px rgba(0, 0, 0, 0.4), inset -4px -4px 10px rgba(0, 0, 0, 0.1), inset 4px 4px 10px rgba(255, 255, 255, 0.3); 
        display: flex; justify-content: center; align-items: center;
        position: relative; box-sizing: border-box;
    }
    @media (max-width: 768px) { .console-body { border-radius: 8vw; } }

    /* -----------------------------------------
       2. The Screen Container & Canvas
       ----------------------------------------- */
    .screen-container {
        width: 58%; height: 85%; 
        background-color: #000000; border-radius: 12px; 
        box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.08), inset -2px -2px 6px rgba(0, 0, 0, 0.5), 0px 0px 0px 3px #1a1a1a;                    
        position: relative; z-index: 10; overflow: hidden; 
        
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; 
        -webkit-transition: background-color 0.3s ease, box-shadow 0.3s ease;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .screen-container.is-on {
        background-color: #1a1a1a; 
        box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.08), inset -2px -2px 6px rgba(0, 0, 0, 0.5), 0px 0px 0px 3px #1a1a1a, inset 0px 0px 40px rgba(255, 255, 255, 0.05); 
    }

    canvas#gameScreen {
        width: 100%; height: 100%;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        display: none; 
    }

    .screen-text {
        color: #4ade80; font-family: 'Press Start 2P', monospace; font-size: 0.8rem;
        text-align: center; display: none; opacity: 0.8; line-height: 1.5;
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }

    .screen-container.is-on .screen-text { display: block; }
    .screen-container.is-playing .screen-text { display: none; }
    .screen-container.is-playing canvas#gameScreen { display: block; }

    /* -----------------------------------------
       3. Controls & Hardware
       ----------------------------------------- */
    .controls-right { position: absolute; right: 0; top: 0; width: 21%; height: 100%; z-index: 20; }
    .btn-action {
        width: 50px; height: 50px; border-radius: 50%; background-color: #6da2e0; border: 5px solid #1a1a1a; 
        display: flex; justify-content: center; align-items: center; color: #ffffff; font-weight: bold; font-size: 1.4rem; text-shadow: 1px 1px 1px rgba(0,0,0,0.3); 
        box-sizing: border-box; cursor: pointer; 
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; 
        box-shadow: 0px 4px 4px rgba(0,0,0,0.3);
        -webkit-transition: -webkit-transform 0.05s ease, box-shadow 0.05s ease; transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-action:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.3); -webkit-transform: translateY(3px); transform: translateY(3px); }
    .btn-a { position: absolute; right: 30px; top: 38%; }
    .btn-b { position: absolute; left: 30px; top: 52%; }

    .controls-left { position: absolute; left: 0; top: 0; width: 21%; height: 100%; z-index: 20; display: flex; justify-content: center; align-items: center; }
    .d-pad-base { width: 110px; height: 110px; background-color: #b5b5b5; border: 4px solid #1a1a1a; border-radius: 50%; position: relative; }
    .d-btn { width: 30px; height: 30px; position: absolute; cursor: pointer; background: transparent; border: none; padding: 0; outline: none; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .d-btn svg { width: 100%; height: 100%; display: block; -webkit-filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3)); filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3)); -webkit-transition: -webkit-transform 0.05s ease, -webkit-filter 0.05s ease; transition: transform 0.05s ease, filter 0.05s ease; }
    .d-btn:active svg { -webkit-filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); -webkit-transform: translateY(3px); transform: translateY(3px); }
    .d-up { top: 8px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); }
    .d-right { top: 50%; right: 8px; -webkit-transform: translateY(-50%) rotate(90deg); transform: translateY(-50%) rotate(90deg); }
    .d-down { bottom: 8px; left: 50%; -webkit-transform: translateX(-50%) rotate(180deg); transform: translateX(-50%) rotate(180deg); }
    .d-left { top: 50%; left: 8px; -webkit-transform: translateY(-50%) rotate(270deg); transform: translateY(-50%) rotate(270deg); }

    .btn-sys {
        position: absolute; width: 90px; height: 32px; background-color: #000000; border-radius: 16px; 
        display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-shadow: 0px 4px 4px rgba(0,0,0,0.4); cursor: pointer;
        left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%);
        -webkit-transition: -webkit-transform 0.05s ease, box-shadow 0.05s ease; transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-sys:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.4); -webkit-transform: translateX(-50%) translateY(3px); transform: translateX(-50%) translateY(3px); }
    
    .btn-select { bottom: 6%; }
    .btn-start { bottom: 6%; }
    
    .btn-l { top: 6%; width: 60px; -webkit-transform: translateX(-50%) rotate(-45deg); transform: translateX(-50%) rotate(-45deg); }
    .btn-l:active { -webkit-transform: translateX(-50%) rotate(-45deg) translateY(3px); transform: translateX(-50%) rotate(-45deg) translateY(3px); }

    .btn-r { top: 6%; width: 60px; -webkit-transform: translateX(-50%) rotate(45deg); transform: translateX(-50%) rotate(45deg); }
    .btn-r:active { -webkit-transform: translateX(-50%) rotate(45deg) translateY(3px); transform: translateX(-50%) rotate(45deg) translateY(3px); }
    
    .btn-power { top: 22%; width: 32px; height: 32px; border-radius: 50%; padding: 0; }

    .power-led { position: absolute; top: calc(22% + 11px); left: calc(50% + 26px); width: 10px; height: 10px; border-radius: 50%; background-color: #1a1a1a; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8); -webkit-transition: all 0.3s ease; transition: all 0.3s ease; }
    .power-led.is-on { background-color: #4ade80; box-shadow: 0px 0px 8px #4ade80, 0px 0px 12px #4ade80, inset 2px 2px 3px rgba(255,255,255,0.6); }
    
    #romInput { display: none; }

    /* -----------------------------------------
       4. Portrait Orientation Warning Overlay
       ----------------------------------------- */
    #orientation-warning {
        display: none; 
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #000000; z-index: 9999; 
        flex-direction: column; justify-content: center; align-items: center;
        color: #39ff14; font-family: 'Press Start 2P', cursive; font-size: 1.2rem;
        text-align: center; text-shadow: 0 0 10px rgba(57, 255, 20, 0.7);
        line-height: 1.8; box-sizing: border-box; padding: 20px;
    }

    @media screen and (orientation: portrait) {
        #orientation-warning { display: flex; }
        .console-body { display: none; }
    }
</style>
</head>
<body>

    <div id="orientation-warning">
        Please rotate<br><br>your device
    </div>

    <div class="console-body">
        
        <div class="controls-left">
            <div class="btn-sys btn-l" id="btnL">L</div>
            <div class="d-pad-base">
                <button class="d-btn d-up" id="btnUp"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#6dc663" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-right" id="btnRight"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#f7d33d" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-down" id="btnDown"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#2c7eea" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-left" id="btnLeft"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#df2b32" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="btn-sys btn-select" id="btnSelect">SELECT</div>
        </div>

        <div class="screen-container" id="screenContainer">
            <div class="screen-text" id="screenMessage">TAP TO INSERT<br>CARTRIDGE</div>
            <canvas id="gameScreen" width="240" height="160"></canvas>
            <input type="file" id="romInput">
        </div>

        <div class="controls-right">
            <div class="btn-sys btn-r" id="btnR">R</div>
            <div class="power-led" id="powerIndicator"></div>
            
            <div class="btn-sys btn-power" id="powerBtn">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <div class="btn-action btn-a" id="btnA">A</div>
            <div class="btn-action btn-b" id="btnB">B</div>
            <div class="btn-sys btn-start" id="btnStart">START</div>
        </div>

    </div>

    <script>
        var gba;
        var runInterval;

        document.addEventListener('DOMContentLoaded', function() {
            var powerBtn = document.getElementById('powerBtn');
            var powerIndicator = document.getElementById('powerIndicator');
            var screenContainer = document.getElementById('screenContainer');
            var romInput = document.getElementById('romInput');
            var screenMessage = document.getElementById('screenMessage');
            var isPowerOn = false;

            // Initialize the emulator object
            try {
                gba = new GameBoyAdvance();
                gba.keypad.eatInput = true;
                gba.setLogger(function(level, error) { console.log(error); });
                gba.setCanvas(document.getElementById('gameScreen'));
            } catch (e) {
                console.error("GBA Engine failed to initialize.", e);
            }

            // Power Button Logic
            powerBtn.addEventListener('click', function() {
                isPowerOn = !isPowerOn;
                powerIndicator.classList.toggle('is-on');
                screenContainer.classList.toggle('is-on');
                
                if (!isPowerOn) {
                    screenContainer.classList.remove('is-playing');
                    screenMessage.innerHTML = "TAP TO INSERT<br>CARTRIDGE";
                    if (gba) { gba.pause(); }
                }
            });

            // Tap Screen to load ROM
            screenContainer.addEventListener('click', function() {
                if (isPowerOn && !screenContainer.classList.contains('is-playing')) {
                    romInput.click();
                }
            });

            // --- ROM LOADING LOGIC ---
            romInput.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;

                var fileName = file.name.toLowerCase();
                if (!fileName.endsWith('.gba')) {
                    screenMessage.innerHTML = "INVALID FILE<br>NEED .GBA";
                    e.target.value = ''; 
                    return;
                }

                screenMessage.innerHTML = "LOADING<br>" + file.name.substring(0, 10) + "...";
                
                var reader = new FileReader();
                reader.onload = function(event) {
                    var romData = event.target.result;
                    
                    setTimeout(function() {
                        if (gba) {
                            try {
                                gba.setRom(romData);
                                gba.runStable();
                                screenContainer.classList.add('is-playing');
                            } catch (error) {
                                screenMessage.innerHTML = "ENGINE CRASH<br>RELOAD PAGE";
                                console.error(error);
                            }
                        }
                    }, 500);
                };
                reader.readAsArrayBuffer(file);
            });

            // --- MULTI-TOUCH CONTROLLER BRIDGE ---
            // Maps your on-screen IDs to the internal keypad bindings of gbajs
            const gbaKeys = {
                'btnUp': gba.keypad.UP,
                'btnDown': gba.keypad.DOWN,
                'btnLeft': gba.keypad.LEFT,
                'btnRight': gba.keypad.RIGHT,
                'btnA': gba.keypad.A,
                'btnB': gba.keypad.B,
                'btnL': gba.keypad.L,
                'btnR': gba.keypad.R,
                'btnStart': gba.keypad.START,
                'btnSelect': gba.keypad.SELECT
            };

            const controls = document.querySelectorAll('.d-btn, .btn-action, .btn-sys');
            controls.forEach(btn => {
                if(!gbaKeys[btn.id] && gbaKeys[btn.id] !== 0) return; 
                
                btn.addEventListener('touchstart', function(e) {
                    e.preventDefault(); 
                    if(gba) gba.keypad.keyboardHandler(new KeyboardEvent("keydown")); // Wakeup
                    if(gba) gba.keypad.currentDown |= gbaKeys[btn.id];
                }, {passive: false});

                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    if(gba) gba.keypad.currentDown &= ~gbaKeys[btn.id];
                }, {passive: false});
                
                // Fallback for mouse testing on desktop
                btn.addEventListener('mousedown', function(e) {
                    if(gba) gba.keypad.currentDown |= gbaKeys[btn.id];
                });
                btn.addEventListener('mouseup', function(e) {
                    if(gba) gba.keypad.currentDown &= ~gbaKeys[btn.id];
                });
            });
        });
    </script>
</body>
</html>
