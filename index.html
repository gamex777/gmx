<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MicroEmu</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MicroEmu">
<link rel="apple-touch-icon" href="icon.png">

<style>
    /* -----------------------------------------
       1. Base Setup & Console Body
       ----------------------------------------- */
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        background-color: #2c2c2c; overflow: hidden; font-family: Arial, sans-serif;
    }
    .console-body {
        width: 100vw; max-width: 900px; height: 45.45vw; max-height: 409px; 
        background-color: #f67a76; border-radius: 50px; 
        box-shadow: 12px 18px 25px rgba(0, 0, 0, 0.4), inset -4px -4px 10px rgba(0, 0, 0, 0.1), inset 4px 4px 10px rgba(255, 255, 255, 0.3); 
        display: flex; justify-content: center; align-items: center;
        position: relative; box-sizing: border-box;
    }
    @media (max-width: 768px) { .console-body { border-radius: 8vw; } }

    /* -----------------------------------------
       2. The Screen Container & Canvas
       ----------------------------------------- */
    .screen-container {
        width: 58%; height: 85%; 
        background-color: #000000; border-radius: 12px; 
        box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.08), inset -2px -2px 6px rgba(0, 0, 0, 0.5), 0px 0px 0px 3px #1a1a1a;                     
        position: relative; z-index: 10; overflow: hidden; 
        
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; 
        -webkit-transition: background-color 0.3s ease, box-shadow 0.3s ease;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .screen-container.is-on {
        background-color: #1a1a1a; 
        box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.08), inset -2px -2px 6px rgba(0, 0, 0, 0.5), 0px 0px 0px 3px #1a1a1a, inset 0px 0px 40px rgba(255, 255, 255, 0.05); 
    }

    canvas#gameScreen {
        width: 100%; height: 100%;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        display: none; 
    }

    .screen-text {
        color: #4ade80; font-family: monospace; font-size: 1rem;
        text-align: center; display: none; opacity: 0.8;
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }

    .screen-container.is-on .screen-text { display: block; }
    .screen-container.is-playing .screen-text { display: none; }
    .screen-container.is-playing canvas#gameScreen { display: block; }

    /* -----------------------------------------
       3. Controls & Hardware
       ----------------------------------------- */
    .controls-right { position: absolute; right: 0; top: 0; width: 21%; height: 100%; z-index: 20; }
    .btn-action {
        width: 65px; height: 65px; border-radius: 50%; background-color: #6da2e0; border: 5px solid #1a1a1a; 
        display: flex; justify-content: center; align-items: center; color: #ffffff; font-weight: bold; font-size: 1.8rem; text-shadow: 1px 1px 1px rgba(0,0,0,0.3); 
        box-sizing: border-box; cursor: pointer; 
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; 
        box-shadow: 0px 4px 4px rgba(0,0,0,0.3);
        -webkit-transition: -webkit-transform 0.05s ease, box-shadow 0.05s ease; transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-action:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.3); -webkit-transform: translateY(3px); transform: translateY(3px); }
    .btn-a { position: absolute; right: 30px; top: 38%; }
    .btn-b { position: absolute; left: 30px; top: 52%; }

    .controls-left { position: absolute; left: 0; top: 0; width: 21%; height: 100%; z-index: 20; display: flex; justify-content: center; align-items: center; }
    .d-pad-base { width: 140px; height: 140px; background-color: #b5b5b5; border: 4px solid #1a1a1a; border-radius: 50%; position: relative; }
    .d-btn { width: 38px; height: 38px; position: absolute; cursor: pointer; background: transparent; border: none; padding: 0; outline: none; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .d-btn svg { width: 100%; height: 100%; display: block; -webkit-filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3)); filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.3)); -webkit-transition: -webkit-transform 0.05s ease, -webkit-filter 0.05s ease; transition: transform 0.05s ease, filter 0.05s ease; }
    .d-btn:active svg { -webkit-filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); filter: drop-shadow(0px 0px 0px rgba(0,0,0,0)); -webkit-transform: translateY(3px); transform: translateY(3px); }
    .d-up { top: 10px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); }
    .d-right { top: 50%; right: 10px; -webkit-transform: translateY(-50%) rotate(90deg); transform: translateY(-50%) rotate(90deg); }
    .d-down { bottom: 10px; left: 50%; -webkit-transform: translateX(-50%) rotate(180deg); transform: translateX(-50%) rotate(180deg); }
    .d-left { top: 50%; left: 10px; -webkit-transform: translateY(-50%) rotate(270deg); transform: translateY(-50%) rotate(270deg); }

    .btn-sys {
        position: absolute; width: 90px; height: 32px; background-color: #000000; border-radius: 16px; 
        display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-shadow: 0px 4px 4px rgba(0,0,0,0.4); cursor: pointer;
        left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%);
        -webkit-transition: -webkit-transform 0.05s ease, box-shadow 0.05s ease; transition: transform 0.05s ease, box-shadow 0.05s ease;
    }
    .btn-sys:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.4); -webkit-transform: translateX(-50%) translateY(3px); transform: translateX(-50%) translateY(3px); }
    .btn-select { bottom: 12%; }
    .btn-start { bottom: 12%; }
    .btn-power { top: 12%; }

    .power-led { position: absolute; top: calc(12% + 11px); left: calc(50% + 55px); width: 10px; height: 10px; border-radius: 50%; background-color: #1a1a1a; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8); -webkit-transition: all 0.3s ease; transition: all 0.3s ease; }
    .power-led.is-on { background-color: #4ade80; box-shadow: 0px 0px 8px #4ade80, 0px 0px 12px #4ade80, inset 2px 2px 3px rgba(255,255,255,0.6); }
    
    #romInput { display: none; }
</style>
</head>
<body>

    <div class="console-body">
        
        <div class="controls-left">
            <div class="d-pad-base">
                <button class="d-btn d-up" id="btnUp"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#6dc663" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-right" id="btnRight"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#f7d33d" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-down" id="btnDown"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#2c7eea" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
                <button class="d-btn d-left" id="btnLeft"><svg viewBox="0 0 100 100"><polygon points="50,10 90,45 90,90 10,90 10,45" fill="#df2b32" stroke="#1a1a1a" stroke-width="10" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="btn-sys btn-select" id="btnSelect">SELECT</div>
        </div>

        <div class="screen-container" id="screenContainer">
            <div class="screen-text" id="screenMessage">TAP TO INSERT<br>CARTRIDGE</div>
            <canvas id="gameScreen" width="240" height="160"></canvas>
            <input type="file" id="romInput">
        </div>

        <div class="controls-right">
            <div class="power-led" id="powerIndicator"></div>
            <div class="btn-sys btn-power" id="powerBtn">POWER</div>
            <div class="btn-action btn-a" id="btnA">A</div>
            <div class="btn-action btn-b" id="btnB">B</div>
            <div class="btn-sys btn-start" id="btnStart">START</div>
        </div>

    </div>

    <script>
        var Module = {
            preRun: [],
            postRun: [],
            print: (text) => console.log("mGBA: " + text),
            
            // Catch runtime errors
            printErr: (text) => {
                console.error("mGBA Error: " + text);
                var screenMsg = document.getElementById('screenMessage');
                var screenContainer = document.getElementById('screenContainer');

                if (screenMsg && screenContainer && !screenContainer.classList.contains('is-playing')) {
                    // Translate common WebAssembly errors into readable codes
                    let errorCode = "ERR_UNKNOWN";
                    if (text.includes("memory")) errorCode = "ERR_MEM_OOB";
                    else if (text.includes("FS")) errorCode = "ERR_FILE_SYS";
                    else if (text.includes("wasm validation error")) errorCode = "ERR_WASM_CORRUPT";
                    else if (text.includes("unreachable")) errorCode = "ERR_CRASH";
                    else if (text.includes("abort")) errorCode = "ERR_ABORT";

                    screenMsg.innerHTML = `SYSTEM HALTED [${errorCode}]<br><span style='color: #ff6b6b; font-size: 0.65rem; line-height: 1.2; display: block; margin-top: 5px;'>${text.substring(0, 75)}</span>`;
                }
            },
            
            // Catch fatal memory aborts
            onAbort: (what) => {
                console.error("mGBA Aborted: ", what);
                var screenMsg = document.getElementById('screenMessage');
                if (screenMsg) {
                    screenMsg.innerHTML = `FATAL EXCEPTION<br><span style='color: #ff6b6b; font-size: 0.65rem; display: block; margin-top: 5px;'>${String(what).substring(0, 60)}</span>`;
                }
            },

            canvas: (function() {
                var canvas = document.getElementById('gameScreen');
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })()
        };
    </script>

    <script src="mgba_wasm.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var powerBtn = document.getElementById('powerBtn');
            var powerIndicator = document.getElementById('powerIndicator');
            var screenContainer = document.getElementById('screenContainer');
            var romInput = document.getElementById('romInput');
            var screenMessage = document.getElementById('screenMessage');
            var isPowerOn = false;

            // --- Power Toggle ---
            powerBtn.addEventListener('click', function() {
                isPowerOn = !isPowerOn;
                powerIndicator.classList.toggle('is-on');
                screenContainer.classList.toggle('is-on');
                
                if (!isPowerOn) {
                    screenContainer.classList.remove('is-playing');
                    screenMessage.innerHTML = "TAP TO INSERT<br>CARTRIDGE";
                }
            });

            // --- File Picker Trigger ---
            screenContainer.addEventListener('click', function() {
                if (isPowerOn && !screenContainer.classList.contains('is-playing')) {
                    romInput.click();
                }
            });

            // --- Drag and Drop Logic ---
            screenContainer.addEventListener('dragover', function(e) { e.preventDefault(); });
            screenContainer.addEventListener('drop', function(e) {
                e.preventDefault();
                if (isPowerOn && !screenContainer.classList.contains('is-playing')) {
                    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        romInput.files = e.dataTransfer.files;
                        romInput.dispatchEvent(new Event('change')); 
                    }
                }
            });

            // --- Diagnostic ROM Loading & Engine Boot Sequence ---
            romInput.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;

                var fileName = file.name.toLowerCase();
                if (!fileName.endsWith('.gba') && !fileName.endsWith('.zip')) {
                    screenMessage.innerHTML = "INVALID FILE<br>NEED .GBA";
                    e.target.value = ''; 
                    return;
                }

                screenMessage.innerHTML = "BOOTING ENGINE...";
                
                var reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        var romData = new Uint8Array(event.target.result);
                        
                        // Pre-Flight Check 1: Is the file completely empty?
                        if (!romData || romData.length === 0) {
                            throw new Error("ERR_EMPTY_ROM: The selected file contains zero data.");
                        }

                        // Pre-Flight Check 2: Did the WebAssembly Engine load?
                        if (typeof FS === 'undefined') {
                            throw new Error("ERR_ENGINE_OFFLINE: mgba_wasm.js failed to initialize the File System. Are you running this on a local server?");
                        }

                        // Write the physical ROM data into the virtual engine hard drive
                        FS.writeFile('/game.gba', romData);
                        console.log("ROM injected into virtual drive. Size: " + romData.length);

                        // Tell the engine to boot the game
                        Module.callMain(['/game.gba']);

                        // Switch screen from text to game canvas
                        screenContainer.classList.add('is-playing');
                        
                    } catch (error) {
                        // Extract exact error code and message
                        var exactError = error.message || error.toString();
                        var errorCode = "ERR_EXEC_FAIL";
                        
                        if (exactError.includes("ERR_")) {
                            let parts = exactError.split(":");
                            errorCode = parts[0];
                            exactError = parts[1] || exactError;
                        }

                        // Print beautiful error formatting to the screen
                        screenMessage.innerHTML = `BOOT FAILED [${errorCode}]<br><span style='color: #ff6b6b; font-size: 0.65rem; line-height: 1.2; display: block; margin-top: 5px;'>${exactError.substring(0, 80)}</span>`;
                        console.error("mGBA Boot Sequence Failed: ", error);
                    }
                };
                
                reader.readAsArrayBuffer(file);
            });

            // --- Virtual Keyboard Control Mapping ---
            const keyMap = {
                'btnUp': 'ArrowUp',
                'btnDown': 'ArrowDown',
                'btnLeft': 'ArrowLeft',
                'btnRight': 'ArrowRight',
                'btnA': 'x',
                'btnB': 'z',
                'btnStart': 'Enter',
                'btnSelect': 'Backspace'
            };

            function simulateKeyEvent(type, key) {
                var event = new KeyboardEvent(type, {
                    key: key,
                    code: (key.startsWith('Arrow') ? key : 'Key' + key.toUpperCase()),
                    bubbles: true,
                    cancelable: true
                });
                document.dispatchEvent(event);
            }

            for (let btnId in keyMap) {
                let buttonElement = document.getElementById(btnId);
                let keyToSimulate = keyMap[btnId];

                // Press Button
                buttonElement.addEventListener('mousedown', (e) => { e.preventDefault(); simulateKeyEvent('keydown', keyToSimulate); });
                buttonElement.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKeyEvent('keydown', keyToSimulate); }, {passive: false});

                // Release Button
                buttonElement.addEventListener('mouseup', (e) => { e.preventDefault(); simulateKeyEvent('keyup', keyToSimulate); });
                buttonElement.addEventListener('touchend', (e) => { e.preventDefault(); simulateKeyEvent('keyup', keyToSimulate); });
                buttonElement.addEventListener('mouseleave', (e) => { simulateKeyEvent('keyup', keyToSimulate); });
            }
        });

        // --- Progressive Web App (Offline Support) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('PWA Offline Worker registered.');
                }).catch(function(err) {
                    console.log('PWA Worker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
