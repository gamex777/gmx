            #boot-gmx::after { content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9), transparent); transform: skewX(-20deg); pointer-events: none; }
            @keyframes gbaDrop { 0% { transform: translateY(-80px) scale(1.1); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

            .wave-line:nth-child(3) { top: 40%; transform: rotate(5deg) scaleY(1.2); border-top: 1px solid rgba(255,255,255,0.2); }

    </style>

<body>

    <script>
        // ===================== AUDIO CONTROLLER =====================
        class GMXAudio {
            constructor() {
                this.context = new (window.AudioContext || window.webkitAudioContext)();
                this.scriptNode = this.context.createScriptProcessor(4096, 0, 2);
                this.scriptNode.connect(this.context.destination);

                this.bufferSize = 8192;
                this.lBuffer = new Float32Array(this.bufferSize);
                this.rBuffer = new Float32Array(this.bufferSize);
                this.readPtr = 0;
                this.writePtr = 0;
                this.unlocked = false;

                this.scriptNode.onaudioprocess = (e) => {
                    const left = e.outputBuffer.getChannelData(0);
                    const right = e.outputBuffer.getChannelData(1);
                    for (let i = 0; i < left.length; i++) {
                        if (this.readPtr !== this.writePtr) {
                            left[i] = this.lBuffer[this.readPtr];
                            right[i] = this.rBuffer[this.readPtr];
                            this.readPtr = (this.readPtr + 1) % this.bufferSize;
                        } else {
                            left[i] = 0; 
                            right[i] = 0;
                        }
                    }
                };
            }

            pushSample(l, r) {
                this.lBuffer[this.writePtr] = l;
                this.rBuffer[this.writePtr] = r;
                this.writePtr = (this.writePtr + 1) % this.bufferSize;
            }

            resume() {
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }
            }

            stop() {
                this.readPtr = 0;
                this.writePtr = 0;
            }

            unlock() {
                if (this.unlocked) return;
                
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }
                
                // Force iOS to unlock the audio context by playing a 10ms silent frequency
                const osc = this.context.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 0;
                osc.connect(this.context.destination);
                osc.start(0);
                osc.stop(0.01);
                
                this.unlocked = true;
            }
        }

        // ===================== CORRECTED JSNES BRIDGE =====================
        class GMXEmulatorBridge {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.isRunning = false;
                this.nes = null;
                this.audio = new GMXAudio();
                
                // NES controller 1 mapping:
                this.nesInputMap = {
                    'btn-a': 0,
                    'btn-b': 1,
                    'btn-select': 2,
                    'btn-start': 3,
                    'btn-up': 4,
                    'btn-down': 5,
                    'btn-left': 6,
                    'btn-right': 7
                };
            }
            
            loadRomData(arrayBuffer, filename) {
                this._stopCurrent();
                
                this.nes = new jsnes.NES({
                    onFrame: (frameBuffer) => { this._renderNESFrame(frameBuffer); },
                    onAudioSample: (l, r) => { this.audio.pushSample(l, r); },
                    sampleRate: this.audio.context.sampleRate
                });
                
                // Convert ArrayBuffer -> Uint8Array -> binary string (JSNES requirement)
                const romBytes = new Uint8Array(arrayBuffer);
                let romString = '';
                for (let i = 0; i < romBytes.length; i++) {
                    romString += String.fromCharCode(romBytes[i]);
                }
                
                try {
                    this.nes.loadROM(romString);
                } catch (e) {
                    this.renderError("BOOT FAILURE", "Invalid NES ROM");
                    return;
                }
                
                this.isRunning = true;
                this.canvas.width = 256;
                this.canvas.height = 240;
                this._startNESLoop();
            }
            
            _startNESLoop() {
                let lastTime = performance.now();
                const fpsInterval = 1000 / 60; // Lock to 60 FPS (16.67ms per frame)
                
                const runFrame = (timestamp) => {
                    if (!this.isRunning || !this.nes) return;
                    
                    // Queue the next frame
                    this._nesFrameReq = requestAnimationFrame(runFrame);
                    
                    const elapsed = timestamp - lastTime;
                    
                    // Only execute the emulator frame if enough time has passed
                    if (elapsed > fpsInterval) {
                        // Adjust lastTime to prevent drift
                        lastTime = timestamp - (elapsed % fpsInterval);
                        this.nes.frame(); 
                    }
                };
                this._nesFrameReq = requestAnimationFrame(performance.now);
            }
            
            _renderNESFrame(frameBuffer) {
                const ctx = this.ctx;
                const imageData = ctx.createImageData(256, 240);
                // JSNES colors are pre-formatted for 32-bit arrays to maximize performance
                const buf32 = new Uint32Array(imageData.data.buffer);
                
                for (let i = 0; i < frameBuffer.length; i++) {
                    // Force full alpha (0xFF) on the color data
                    buf32[i] = 0xFF000000 | frameBuffer[i]; 
                }
                
                ctx.putImageData(imageData, 0, 0);
            }
            
            handleInput(domId, isPressed) {
                if (!this.isRunning || !this.nes) return;
                const nesBtn = this.nesInputMap[domId];
                
                if (nesBtn !== undefined) {
                    if (isPressed) {
                        this.nes.buttonDown(1, nesBtn);
                    } else {
                        this.nes.buttonUp(1, nesBtn);
                    }
                }
            }
            
            handleAnalog(stickId, nx, ny) {
                if (!this.isRunning) return;
                const deadzone = 0.4;
                ['btn-up','btn-down','btn-left','btn-right'].forEach(btn => {
                    this.handleInput(btn, false);
                });
                if (ny < -deadzone) this.handleInput('btn-up', true);
                if (ny > deadzone) this.handleInput('btn-down', true);
                if (nx < -deadzone) this.handleInput('btn-left', true);
                if (nx > deadzone) this.handleInput('btn-right', true);
            }
            
            _stopCurrent() {
                this.isRunning = false;
                if (this._nesFrameReq) cancelAnimationFrame(this._nesFrameReq);
                this.nes = null;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                if (this.audio) this.audio.stop();
            }
            
            stop() {
                this._stopCurrent();
            }
            
            renderError(title, subtitle) {
                this._stopCurrent();
                const w = this.canvas.width || 256, h = this.canvas.height || 240;
                this.ctx.fillStyle = '#050505'; this.ctx.fillRect(0, 0, w, h);
                this.ctx.fillStyle = '#ff4444'; this.ctx.font = 'bold 20px sans-serif'; this.ctx.fillText(title, 40, h/2);
                this.ctx.fillStyle = '#ffffff'; this.ctx.font = '12px sans-serif'; this.ctx.fillText(subtitle, 40, h/2 + 25);
            }
        }
        const gmxBridge = new GMXEmulatorBridge('game-canvas');

        // --- IndexedDB, XMB, install popup, controls, power, joysticks, clock ---
        const DB_NAME = "GMX_Storage";
        const STORE_NAME = "library";
        function initDB() { return new Promise((resolve, reject) => { const req = indexedDB.open(DB_NAME, 1); req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id" }); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
        async function saveGameToDB(romFile, imgFile) {
            const db = await initDB();
            const romBuffer = await romFile.arrayBuffer();
            let coverDataUrl = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="; 
            if (imgFile) { coverDataUrl = await new Promise(res => { const reader = new FileReader(); reader.onload = e => res(e.target.result); reader.readAsDataURL(imgFile); }); }
            const gameId = romFile.name.replace(/\.[^/.]+$/, ""); 
            const record = { id: gameId, title: gameId, rom: romBuffer, cover: coverDataUrl };
            return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, "readwrite"); tx.objectStore(STORE_NAME).put(record); tx.oncomplete = resolve; tx.onerror = reject; });
        }

        let currentScale = 1;
        const consoleEl = document.getElementById('gmx-console');
        const applyScale = () => { if (window.innerHeight > window.innerWidth) return; currentScale = Math.min((window.innerWidth * 0.95) / 735, (window.innerHeight * 0.95) / 350, 1); consoleEl.style.transform = `scale(${currentScale})`; };
        window.addEventListener('resize', applyScale); applyScale();

        let isPoweredOn = false, isOSReady = false, colIdx = 1, rowIdx = 0; 
        const maxRows = [1, 1, 1];
        const grid = document.getElementById('xmb-grid');
        const cols = document.querySelectorAll('.xmb-col');
        const sysMsg = document.getElementById('sys-msg');
        const screen = document.getElementById('screen');

        async function buildXMB() {
            const db = await initDB();
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => {
                    const games = req.result;
                    const gameCol = document.getElementById('game-column');
                    const memStick = document.getElementById('memory-stick');
                    document.querySelectorAll('.dynamic-game').forEach(el => el.remove());
                    let newMaxRows = 1; 
                    games.forEach(game => {
                        const div = document.createElement('div');
                        div.className = 'xmb-sub game-item dynamic-game';
                        div.innerHTML = `<img src="${game.cover}" class="box-art" crossorigin="anonymous"><div class="game-details"><span class="game-title">${game.title}</span></div>`;
                        gameCol.insertBefore(div, memStick);
                        newMaxRows++;
                    });
                    maxRows[1] = newMaxRows; 
                    resolve();
                };
            });
        }
        const updateXMB = () => {
            if(!isOSReady) return;
            grid.style.transform = `translate(calc(-50% + ${(1 - colIdx) * 100}px), ${-rowIdx * 60}px)`;
            cols.forEach((col, c) => {
                if (c === colIdx) { col.classList.add('active-col'); Array.from(col.children).forEach((item, r) => item.classList.toggle('active-item', r === rowIdx)); }
                else { col.classList.remove('active-col'); Array.from(col.children).forEach(item => item.classList.remove('active-item')); }
            });
            const gameBgLayer = document.getElementById('game-bg-layer');
            const activeItem = document.querySelector('.active-col .active-item.dynamic-game img');
            if (activeItem) { gameBgLayer.style.backgroundImage = `linear-gradient(to right, rgba(30,31,58,0.95) 0%, rgba(30,31,58,0.4) 60%, rgba(0,0,0,0) 100%), url('${activeItem.src}')`; gameBgLayer.style.opacity = 1; }
            else gameBgLayer.style.opacity = 0;
            
            // Show "(X) Delete Game" when a game is selected
            const gameItems = document.querySelectorAll('.dynamic-game');
            if (colIdx === 1 && rowIdx > 0 && rowIdx <= gameItems.length) {
                sysMsg.innerText = "(X) Delete Game";
                sysMsg.style.opacity = 1;
            } else {
                sysMsg.innerText = "";
                sysMsg.style.opacity = 0;
            }
        };

        const popup = document.getElementById('install-popup');
        const romInput = document.getElementById('install-rom-upload');
        const coverInput = document.getElementById('install-cover-upload');
        const romNameEl = document.getElementById('popup-rom-name');
        const coverNameEl = document.getElementById('popup-cover-name');
        const installBtn = document.getElementById('popup-install');
        let selectedRomFile = null, selectedCoverFile = null;
        function openInstallPopup() { popup.classList.add('visible'); selectedRomFile = null; selectedCoverFile = null; romInput.value = ''; coverInput.value = ''; romNameEl.textContent = ''; coverNameEl.textContent = ''; installBtn.disabled = true; sysMsg.style.opacity = 0; }
        function closeInstallPopup() { popup.classList.remove('visible'); }
        document.getElementById('popup-select-rom').addEventListener('click', () => romInput.click());
        document.getElementById('popup-select-cover').addEventListener('click', () => coverInput.click());
        romInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.name.toLowerCase().endsWith('.nes')) {
                selectedRomFile = file;
                romNameEl.textContent = file.name;
                installBtn.disabled = false;
            } else {
                alert('Please select a .nes file.');
                romInput.value = '';
            }
        });
        coverInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) { selectedCoverFile = file; coverNameEl.textContent = file.name; }
        });
        document.getElementById('popup-install').addEventListener('click', async () => {
            if (!selectedRomFile) return;
            sysMsg.innerText = `Installing ${selectedRomFile.name}...`; sysMsg.style.opacity = 1;
            closeInstallPopup();
            await saveGameToDB(selectedRomFile, selectedCoverFile);
            sysMsg.innerText = "Install Complete!";
            setTimeout(() => { sysMsg.style.opacity = 0; buildXMB().then(() => updateXMB()); }, 1500);
        });

        const bindInput = (id, navAction) => {
            const el = document.getElementById(id);
            const trigger = (e) => { e.preventDefault(); el.classList.add('pressed'); if (screen.classList.contains('game-running')) gmxBridge.handleInput(id, true); else if (navAction) navAction(); };
            const release = (e) => { e.preventDefault(); el.classList.remove('pressed'); if (screen.classList.contains('game-running')) gmxBridge.handleInput(id, false); };
            el.addEventListener('mousedown', trigger); el.addEventListener('touchstart', trigger, {passive: false});
            el.addEventListener('mouseup', release); el.addEventListener('touchend', release); el.addEventListener('mouseleave', release);
        };
        const navLeft = () => { if(colIdx > 0 && isOSReady && !popup.classList.contains('visible')) { colIdx--; rowIdx = 0; updateXMB(); } };
        const navRight = () => { if(colIdx < 2 && isOSReady && !popup.classList.contains('visible')) { colIdx++; rowIdx = 0; updateXMB(); } };
        const navUp = () => { if(rowIdx > 0 && isOSReady && !popup.classList.contains('visible')) { rowIdx--; updateXMB(); } };
        const navDown = () => { if(rowIdx < maxRows[colIdx] && isOSReady && !popup.classList.contains('visible')) { rowIdx++; updateXMB(); } };
        bindInput('btn-left', navLeft); bindInput('btn-right', navRight); bindInput('btn-up', navUp); bindInput('btn-down', navDown);
        bindInput('btn-b', () => { if (popup.classList.contains('visible')) closeInstallPopup(); });
        bindInput('btn-y', null);
        bindInput('btn-l1', null); bindInput('btn-l2', null); bindInput('btn-r1', null); bindInput('btn-r2', null);
        bindInput('btn-start', null); bindInput('btn-select', null);
        
        bindInput('btn-a', async () => {
            if(!isOSReady || popup.classList.contains('visible')) return;
            
            // Resume audio context on user interaction to bypass autoplay blockers
            gmxBridge.audio.resume();
            
            if (colIdx === 1) {
                const games = document.querySelectorAll('.dynamic-game');
                if (rowIdx > 0 && rowIdx <= games.length) {
                    const selectedTitle = games[rowIdx - 1].querySelector('.game-title').innerText;
                    sysMsg.innerText = "BOOTING: " + selectedTitle; sysMsg.style.opacity = 1;
                    const db = await initDB(); const tx = db.transaction(STORE_NAME, "readonly"); const req = tx.objectStore(STORE_NAME).get(selectedTitle);
                    req.onsuccess = () => {
                        setTimeout(() => {
                            screen.classList.add('game-running');
                            screen.classList.remove('os-ready');
                            gmxBridge.loadRomData(req.result.rom, selectedTitle + '.nes');
                        }, 800);
                    };
                } else if (rowIdx === games.length + 1) { openInstallPopup(); }
            } else { sysMsg.innerText = "Module offline."; sysMsg.style.opacity = 1; }
        });

        // Delete game function
        async function deleteSelectedGame() {
            if (!isOSReady || popup.classList.contains('visible') || screen.classList.contains('game-running')) return;
            if (colIdx !== 1) return;
            const gameItems = document.querySelectorAll('.dynamic-game');
            if (rowIdx < 1 || rowIdx > gameItems.length) return;
            
            const selectedTitle = gameItems[rowIdx - 1].querySelector('.game-title').innerText;
            sysMsg.innerText = `Deleting ${selectedTitle}...`;
            sysMsg.style.opacity = 1;
            
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).delete(selectedTitle);
            await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; });
            
            await buildXMB();
            rowIdx = Math.min(rowIdx, maxRows[1] - 1);
            updateXMB();
            sysMsg.style.opacity = 0;
        }
        bindInput('btn-x', deleteSelectedGame);

        const btnPower = document.getElementById('btn-power'), bootContainer = document.getElementById('boot-logo-container');
        let bootTimers = [];
        const togglePower = (e) => {
            if(e) e.preventDefault();
            
            // Unlock iOS Audio on the very first physical tap of the power button
            gmxBridge.audio.unlock(); 
            
            isPoweredOn = !isPoweredOn; isOSReady = false;
            bootTimers.forEach(t => clearTimeout(t)); bootTimers = [];
            if(isPoweredOn) {
                document.getElementById('power-led').classList.add('is-on');
                screen.classList.add('boot-white'); 
                bootTimers.push(setTimeout(() => bootContainer.classList.add('do-drop'), 200));
                bootTimers.push(setTimeout(() => { document.getElementById('boot-gmx').classList.add('do-glint'); document.getElementById('boot-reg').classList.add('do-fade-in'); }, 1000));
                bootTimers.push(setTimeout(() => bootContainer.classList.add('do-fade-out'), 3000));
                bootTimers.push(setTimeout(() => { buildXMB().then(() => { screen.classList.remove('boot-white'); screen.classList.add('os-ready'); isOSReady = true; colIdx = 1; rowIdx = 0; updateXMB(); }); }, 3500));
            } else {
                document.getElementById('power-led').classList.remove('is-on');
                screen.className = ''; bootContainer.classList.remove('do-drop', 'do-fade-out');
                document.getElementById('boot-gmx').classList.remove('do-glint'); document.getElementById('boot-reg').classList.remove('do-fade-in');
                sysMsg.style.opacity = 0; gmxBridge.stop(); closeInstallPopup();
            }
        };
        btnPower.addEventListener('click', togglePower); btnPower.addEventListener('touchstart', togglePower, {passive: false});

        const initJoystick = (socketId, capId, isLeftStick) => {
            const socket = document.getElementById(socketId), cap = document.getElementById(capId);
            let isDragging = false, originX, originY, maxRad, touchId = null, navInt = null, curDir = null;
            const executeNav = (dir) => { if (screen.classList.contains('game-running') || popup.classList.contains('visible')) return; if (isOSReady) { if (dir === 'left') navLeft(); if (dir === 'right') navRight(); if (dir === 'up') navUp(); if (dir === 'down') navDown(); } };
            const trigNav = (dir) => { if (curDir === dir) return; curDir = dir; clearInterval(navInt); executeNav(dir); navInt = setInterval(() => executeNav(dir), 200); };
            const stopNav = () => { clearInterval(navInt); navInt = null; curDir = null; };
            const startDrag = (e) => { isDragging = true; cap.style.transition = 'none'; const r = socket.getBoundingClientRect(); originX = r.left + r.width/2; originY = r.top + r.height/2; maxRad = (socket.offsetWidth/2) - (cap.offsetWidth/2) + 5; if (e.type === 'touchstart') { touchId = e.changedTouches[0].identifier; move(e.changedTouches[0]); } else move(e); };
            const move = (e) => {
                let dx = (e.clientX - originX) / currentScale, dy = (e.clientY - originY) / currentScale; const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > maxRad) { dx *= maxRad/dist; dy *= maxRad/dist; }
                cap.style.transform = `translate(${dx}px, ${dy}px) rotateX(${dy/maxRad*-15}deg) rotateY(${dx/maxRad*15}deg)`;
                if (screen.classList.contains('game-running')) gmxBridge.handleAnalog(isLeftStick ? 'left-stick' : 'right-stick', dx/maxRad, dy/maxRad);
                else if (isOSReady && !popup.classList.contains('visible')) {
                    if (dist > maxRad * 0.6) { const ang = Math.atan2(dy, dx) * (180/Math.PI); trigNav(ang >= -45 && ang <= 45 ? 'right' : ang > 45 && ang < 135 ? 'down' : ang < -45 && ang > -135 ? 'up' : 'left'); }
                    else if (dist < maxRad * 0.2) stopNav();
                }
            };
            const handleDrag = (e) => { if (!isDragging) return; if (e.type === 'touchmove') { for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === touchId) { move(e.changedTouches[i]); break; } } else move(e); };
            const stopDrag = () => { isDragging = false; touchId = null; stopNav(); cap.style.transition = 'transform 0.1s linear'; cap.style.transform = 'translate(0px, 0px)'; if (screen.classList.contains('game-running')) gmxBridge.handleAnalog(isLeftStick ? 'left-stick' : 'right-stick', 0, 0); };
            cap.addEventListener('mousedown', startDrag); cap.addEventListener('touchstart', startDrag, {passive: false});
            window.addEventListener('mousemove', handleDrag); window.addEventListener('touchmove', handleDrag, {passive: false});
            window.addEventListener('mouseup', stopDrag); window.addEventListener('touchend', stopDrag); window.addEventListener('mouseleave', stopDrag);
        };
        initJoystick('joystick-socket-left', 'joystick-cap-left', true);
        initJoystick('joystick-socket-right', 'joystick-cap-right', false);
        document.addEventListener('touchmove', e => { if(e.target.tagName !== 'INPUT') e.preventDefault(); }, {passive: false});

        const updateClock = () => {
            const now = new Date(); const month = now.getMonth() + 1, date = now.getDate();
            let hours = now.getHours(); const ampm = hours >= 12 ? 'PM' : 'AM'; hours = hours % 12 || 12; 
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const clockEl = document.getElementById('xmb-clock'); if (clockEl) clockEl.innerText = `${month}/${date} ${hours}:${minutes}${ampm}`;
        };
        updateClock(); setInterval(updateClock, 1000);
    </script>
