<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HTML Switch PWA - GMX Edition</title>
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GMX">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css?family=Play&display=swap');

  /* Base PWA Resets */
  * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  body {
    height: 100dvh;
    width: 100dvw;
    margin: 0;
    display: grid;
    place-items: center;
    background-color: #121212;
    overflow: hidden;
  }

  article {
    --joycon-left: #00c5e2;
    --joycon-left-shadow: #0128;
    --joycon-right: #ff6658;
    --joycon-right-shadow: #c218;
    position: relative;
    font-size: min(90dvw, 211.4dvh); 
    width: 1em;
    aspect-ratio: 632 / 269;
    background: #f000;
  }

  article *,
  article *::before,
  article *::after {
    position: absolute;
    box-sizing: border-box;
  }

  :focus {
    outline: 1px dashed;
    outline-offset: 2px;
  }

  .round { border-radius: 50%; }

  .body {
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 72.1%;
    height: 99%;
  }

  .frame {
    width: 100%;
    height: 100%;
    border-radius: 0.002em;
    background: 
      radial-gradient(farthest-side, #2f3638 50%, #0000) -1% 3% / 2% 2%,
      radial-gradient(farthest-side, #2f3638, #0000) 1% -0.75% / 2% 2%,
      radial-gradient(95% 70% at 0% 0%, #2f3638 85%, #fff3, #f000) 0.5% 0.75% / 1.55% 5.25% no-repeat,
      radial-gradient(farthest-side, #2f3638 50%, #0000) 101% 3% / 2% 2%,
      radial-gradient(farthest-side, #2f3638, #0000) 99% -0.75% / 2% 2%,
      radial-gradient(95% 70% at 100% 0%, #2f3638 85%, #fff3, #f000) 99.5% 0.75% / 1.55% 5.25% no-repeat,
      linear-gradient(#0000 1%, #fff3 2%, #0000 4%),
      linear-gradient(#0000 95%, #0008),
      #2f3638;
    background-repeat: no-repeat;
    box-shadow:
      inset -0.0015em 0 0.00075em -0.00075em #fff5,
      inset 0.0015em 0 0.00075em -0.00075em #fff6;
    -webkit-mask:
      radial-gradient(farthest-side at 100% 100%, #f00 99.99%, #f000) 0 3.9% / 0.6% 1% no-repeat,
      radial-gradient(farthest-side at 100% 100%, #f00 99.99%, #f000) 1.7% 0% / 0.4% 1% no-repeat,
      radial-gradient(78.33% 60.33% at 0% 0%, #f000 99%, #f00) 0.5% 0.75% / 1.55% 5.25% no-repeat,
      radial-gradient(farthest-side at 0% 100%, #f00 99.99%, #f000) 100% 3.9% / 0.6% 1% no-repeat,
      radial-gradient(farthest-side at 0% 100%, #f00 99.99%, #f000) 98.3% 0% / 0.4% 1% no-repeat,
      radial-gradient(78.33% 60.33% at 100% 0%, #f000 99%, #f00) 99.5% 0.75% / 1.55% 5.25% no-repeat,
      linear-gradient(#0000 4.7%, #000 0),
      linear-gradient(90deg,#0000 2%, #000 0 98%, #0000 0);
  }

  .frame::before {
    content: "";
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 94%;
    height: 93%;
    border-radius: 0.011em;
    border: 0.0003em solid #000;
    box-shadow: 
      0 0.00045em 0.001em #fff8,
      inset 0 0.0006em 0.0015em -0.00025em #000,
      inset 0 0.0007em 0.0015em -0.00025em #fffc;
    background: 
      radial-gradient(circle at 32.7% 98%, #0e0e0e 0.9%, #000 0 1%, #0e0e0e 0 1.2%, #0000 0),
      linear-gradient(#0e0e0e 0 0) 32.33% 100% / 2.1% 2% no-repeat,
      #000;
  }

  /* --- SCREEN POWER LOGIC & BOOT SEQUENCE --- */
  .screen {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 77.5%;
    border-radius: 0.001em;
    background: #292d30;
    box-shadow: inset 0 0.0015em 0.005em -0.0015em #000c;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
  }

  .screen.power-off {
    background: #020202 !important;
    box-shadow: inset 0 0 20px #000 !important;
  }

  .boot-sequence {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: black;
    font-family: 'Play', sans-serif;
    transform-style: preserve-3d;
    perspective: 0.25em; 
    overflow: hidden;
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .screen.is-booting .boot-sequence {
    opacity: 1;
  }

  .boot-inner {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-wrap: wrap; align-content: flex-start;
    padding: 1%; padding-top: 10%;
    transform-style: preserve-3d;
  }

  .screen.is-booting .boot-inner {
    animation: boot-enter 8s cubic-bezier(1,0,.4,1) forwards;
  }

  .boxes-wrapper {
    display: flex; flex-wrap: wrap; width: 100%; height: 100%;
    transform-style: preserve-3d;
  }

  .box-container {
    width: calc(100% / 14);
    padding: 1%;
    position: relative;
    transform-style: preserve-3d;
  }

  .box {
    width: 100%; padding-top: 100%;
    position: relative;
    transform-style: preserve-3d;
  }

  .box .top, .box .bottom, .box .left, .box .right {
    position: absolute; 
    width: 100%; height: 100%;
    box-shadow: inset 0 0 0.005em rgba(0, 255, 255, 0.07);
  }

  .box .top { height: 0.15em; bottom: 100%; left: 0; transform-origin: 100% 100%; transform: rotateX(90deg); background: linear-gradient(to top, rgba(155,166,198,.9), rgba(0,0,0,0)); }
  .box .bottom { height: 0.15em; top: 100%; left: 0; transform-origin: 0% 0%; transform: rotateX(-90deg); background: linear-gradient(to bottom, rgba(99,108,148,.9), rgba(0,0,0,0)); }
  .box .left { width: 0.15em; top: 0; right: 100%; transform-origin: 100% 100%; transform: rotateY(-90deg); background: linear-gradient(to left, rgba(125,136,178,.9), rgba(0,0,0,0)); }
  .box .right { width: 0.15em; top: 0; left: 100%; transform-origin: 0% 0%; transform: rotateY(90deg); background: linear-gradient(to right, rgba(125,136,178,.9), rgba(0,0,0,0)); }

  .boot-content {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    text-align: center; color: white; z-index: 200;
  }
  .screen.is-booting .boot-content {
    animation: boot-content-bg 8s forwards;
  }
  .boot-content p {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0;
  }
  .boot-content .copyright {
    font-size: 0.015em; text-shadow: #000 0px 0px 2px; opacity: 0;
  }
  .screen.is-booting .boot-content .copyright {
    animation: boot-copyright 8s linear forwards;
  }
  .boot-content .branding { font-size: 0.04em; opacity: 0; }
  .screen.is-booting .boot-content .branding {
    animation: boot-branding 8s cubic-bezier(0,.74,.46,1) forwards;
  }
  .boot-content .branding .is-small { font-size: .3em; vertical-align: super; }

  .particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; }
  .particles span { display: block; width: 1px; height: 1px; background: white; position: absolute; border-radius: 50%; opacity: 0; }
  .particles span:nth-child(1) { left: 70%; top: 70%; box-shadow: 0 0 0.01em 0.005em rgba(255,0,0,.8); }
  .particles span:nth-child(2) { left: 70%; top: 50%; box-shadow: 0 0 0.01em 0.005em rgba(0,255,0,.8); }
  .particles span:nth-child(3) { left: 15%; top: 75%; box-shadow: 0 0 0.01em 0.005em rgba(0,0,255,.8); }
  
  .screen.is-booting .particles span:nth-child(1) { animation: p1 4s cubic-bezier(0,.74,.46,1) infinite; }
  .screen.is-booting .particles span:nth-child(2) { animation: p2 4s cubic-bezier(0,.74,.46,1) infinite; }
  .screen.is-booting .particles span:nth-child(3) { animation: p3 4s cubic-bezier(0,.74,.46,1) infinite; }

  @keyframes boot-enter {
    0% { transform: rotate(-20deg); }
    60%, 100% { transform: rotate(100deg) scale(4); }
  }
  @keyframes boot-copyright {
    0%, 5% { opacity: 0; }
    10%, 35% { opacity: 1; }
    40%, 100% { opacity: 0; }
  }
  @keyframes boot-content-bg {
    0% { background-color: black; }
    5%, 43% { background: transparent; }
    48%, 100% { background-color: black; }
  }
  @keyframes boot-branding {
    0%, 65% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(1.5); }
    68%, 93% { opacity: 1; transform: translate3d(-50%, -50%, 0) scale(1); }
    96%, 100% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(1.5); }
  }
  @keyframes p1 { 0% {opacity:0; transform:none;} 20%, 80% {opacity:1;} 100% {transform: translate(-0.15em, -0.1em); opacity:0;} }
  @keyframes p2 { 0% {opacity:0; transform:none;} 20%, 80% {opacity:1;} 100% {transform: translate(-0.2em, 0.05em); opacity:0;} }
  @keyframes p3 { 0% {opacity:0; transform:none;} 20%, 80% {opacity:1;} 100% {transform: translate(0.25em, -0.1em); opacity:0;} }

  /* --- CONTROLLERS --- */
  .controller {
    opacity: 10.7;
    --color: var(--joycon-left);
    --color-shadow: var(--joycon-left-shadow);
    width: 13.85%;
    height: 99%;
    bottom: 0;
    left: 0;
    border-radius: 0.09em 0.004em 0.002em 0.09em;
    background: var(--color);
    box-shadow:
      0.02em 0.0105em 0 -0.0123em #020100,
      inset 0.001em -0.009em 0.01em -0.003em var(--color-shadow),
      inset 0.035em 0 0.025em -0.025em #0002,
      inset -0.002em 0 0.004em var(--color),
      inset 0.006em 0.016em 0.005em -0.008em var(--color),
      inset 0 0.017em 0.005em -0.008em #fff,
      inset 0.005em -0.005em 0.01em -0.004em var(--color-shadow);
  }

  .controller::before {
    content: "";
    width: 0.00275em;
    aspect-ratio: 1;
    background: #393537;
    box-shadow: inset 0.0001em 0.00075em 0.0004em #fff3;
    left: 100%;
    top: 97.75%;
    border-radius: 50%;
  }

  .controller.right {
    --color: var(--joycon-right);
    --color-shadow: var(--joycon-right-shadow);
    left: auto;
    right: 0;
    border-radius: 0.004em 0.09em 0.09em 0.002em;
    box-shadow:
      -0.02em 0.0105em 0 -0.0123em #020100,
      inset -0.001em -0.009em 0.01em -0.003em #000a,
      inset -0.035em 0 0.025em -0.025em #0002,
      inset 0.002em 0 0.004em var(--color),
      inset -0.006em 0.016em 0.005em -0.008em var(--color),
      inset 0 0.017em 0.005em -0.008em #fff,
      inset -0.01em 0 0.01em -0.004em var(--color-shadow);
  }

  .controller.right::before {
    left: auto;
    right: 100%;
    box-shadow: inset -0.0001em 0.00075em 0.0004em #fff3;
  }
  
  /* --- SURFACE BUMPERS --- */
  .bumper {
    position: absolute;
    width: 32%;
    height: 3%;
    background: #25282a; 
    z-index: 10;
    cursor: pointer;
    transition: all 0.05s ease;
    box-shadow: 
      inset 0 0.001em 0.001em #000a,
      0 0.001em 0.001em #fff2;
    border-radius: 80% 80% 40% 40% / 150% 150% 60% 60%;
  }

  .bumper::after {
    content: "";
    position: absolute;
    top: 15%; left: 10%; width: 80%; height: 70%;
    background: linear-gradient(to bottom, #4a4e52, #2a2e31);
    border-radius: 70% 70% 30% 30% / 120% 120% 40% 40%;
    box-shadow: 0 0.001em 0.001em #0006;
  }

  .l-bumper { top: 5.5%; left: 2.5%; transform: rotate(-45deg); }
  .r-bumper { top: 5.5%; right: 2.5%; left: auto; transform: rotate(45deg); }

  .bumper::before {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-family: 'Play', Helvetica, sans-serif;
    font-size: 0.011em;
    font-weight: bold;
    z-index: 20;
    text-shadow: 0 -0.0005em 0 #000;
  }

  .l-bumper::before { content: "L"; }
  .r-bumper::before { content: "R"; }

  .bumper.active::after {
    filter: brightness(0.6);
    transform: translateY(0.001em);
  }
  
  /* --- OTHER BUTTONS --- */
  button {
    border: 0;
    font-size: 1em;
    padding: 0;
    transition: filter 0.05s ease, transform 0.05s ease;
    cursor: pointer;
    z-index: 10;
  }

  button.active:not(.bumper) {
    filter: brightness(0.7);
    transform: scale(0.95);
  }

  .minus {
    --c: #404040;
    width: 17%;
    height: 1.8%;
    background: var(--c);
    top: 8.9%;
    right: 7.7%;
    border-radius: 0.0015em;
    border: 0.001em solid var(--color-shadow);
    box-shadow:
      inset 0.00075em -0.00075em 0.0005em #0008,
      inset -0.0006em 0 0.0005em #0003,
      inset 0 0.00075em 0.0005em #fff6,
      0 0.002em 0.0025em -0.001em #0006;
  }

  .plus { left: 7.7%; right: auto; }

  .plus::before {
    content: "";
    width: 35%;
    height: 400%;
    background: var(--c);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 0.0015em;
    border: 0.001em solid var(--color-shadow);
    box-shadow:
      0 0.004em 0.02em var(--color-shadow),
      inset -0.0006em 0 0.0004em #0007,
      inset 0.0006em 0 0.0004em #0007,
      inset 0 -0.001em 0.0005em -0.0002em #0008,
      inset 0 0.00075em 0.0005em -0.0002em #fff6;
  }

  .plus::after {
    content: "";
    width: 35%;
    aspect-ratio:1 ;
    background: 
      radial-gradient(circle at 0 0, #834 20%, #0000 20% 35%, var(--c) 0) 0 0 / 50% 50%,
      conic-gradient(at 0 0, #000, #fff) 1% 1% / 40% 40%,
      radial-gradient(circle at 100% 0, #834 20%, #0000 20% 35%, var(--c) 0) 100% 0 / 50% 50%,
      conic-gradient(at 100% 0, #fff 25%, #000) 99% 1% / 40% 40%,
      radial-gradient(circle at 0% 100%, #834 20%, #0000 20% 35%, var(--c) 0) 1% 99% / 50% 50%,
      radial-gradient(at 0% 100%,  #0008, #0000) 1% 99% / 40% 40%,
      radial-gradient(circle at 100% 100%, #834 20%, #0000 20% 35%, var(--c) 0) 99% 99% / 50% 50%,
      radial-gradient(at 100% 100%,  #0008, #0000) 100% 99% / 40% 40%,
      var(--c);
    background-repeat: no-repeat;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* --- JOYSTICK PHYSICS --- */
  .mushroom {
    width: 47%;
    aspect-ratio: 1;
    border: 0.001em solid var(--color-shadow);
    top: 17.5%;
    left: 30%;
    background:
      radial-gradient(circle at 50% 0, #6669, #6660 60%),
      #2a2e31;
    box-shadow:
      inset 0 0.0001em 0.00125em -0.0005em var(--color),
      inset 0 0.003em 0.003em #0004,
      inset 0 -0.005em 0.003em #0006,
      0 -0.0009em 0.001em 0.001em #0003,
      0 0.00075em 0.001em 0.001em #0003,
      0 0.01em 0.01em -0.0025em #0004,
      0 0.025em 0.035em var(--color-shadow);
    transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }

  .mushroom.dragging {
    transition: none;
    filter: brightness(0.8);
  }

  .right .mushroom { top: 61.5%; left: 23.25% }

  .mushroom::before {
    content: "";
    width: 80%;
    aspect-ratio: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%; 
    background: radial-gradient(circle at 50% 0, #6669, #6660 60%);
    box-shadow:
      inset 0 0 0.001em #0008,
      inset 0 0.002em 0.002em #0008,
      inset 0 -0.001em 0.001em 0.001em #fff4,
      0 0.001em 0.001em #fff2,
      0 -0.0007em 0.001em 0.0006em #0008,
      0 -0.0025em 0.0015em 0.0006em #fff2
  }

  .mushroom::after {
    content: "";
    width: 95%;
    aspect-ratio: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%; 
    background: 
      linear-gradient(90deg, #000, #0000 20% 80%, #000) 50% 0 / 3% 12%,
      linear-gradient(#000 5%, #444 15% 30%, #666 50%, #3c3c3c, #484848) 50% 0 / 3% 12%,
      linear-gradient(#0000 30% 90%, #fff) 0% 50% / 12% 3%,
      linear-gradient(#000, #0000 30% 70%, #000) 0% 50% / 12% 3%,
      linear-gradient(90deg, #fff4, #222 10% 50%, #444) 0% 50% / 12% 3%,
      linear-gradient(#0000 30% 90%, #fff) 100% 50% / 12% 3%,
      linear-gradient(#000, #0000 30% 70%, #000) 100% 50% / 12% 3%,
      linear-gradient(to left, #fff4, #222 10% 50%, #444) 100% 50% / 12% 3%,
      linear-gradient(90deg, #000, #0000 20% 80%, #000) 50% 100% / 3% 12%,
      linear-gradient(to top, #fff4, #111 15% 50%, #444) 50% 100% / 3% 12%,
      #f000;
    background-repeat: no-repeat;
  }

  .direction {
    display: grid;
    place-items: center;
    width: 23%;
    aspect-ratio: 1;
    border: 0.0007em solid var(--color-shadow);
    background:
      linear-gradient(#fff2, #fff0),
      #35393c;
    box-shadow:
      0 0.002em 0.007em var(--color-shadow),
      inset 0 0.0001em 0.0015em -0.0005em var(--color),
      inset 0 0 0.0005em 0.001em #323439,
      inset 0 0.002em 0.001em 0.0002em #def5,
      inset 0 -0.001em 0.0005em 0.0002em #000,
      inset 0 -0.001em 0.001em 0.002em #000c
  }

  .direction::before {
    font-size: 0.0175em;
    font-family: Helvetica, sans-serif;
    color: #fffa;
  }

  .arrow::before,
  .arrow::after {
    content: "";
    width: 40%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #252525;
    clip-path: polygon(52% -2%, 100% 80%, 0 80%, 48% -2%);
  }

  .arrow::before {
    top: 51.5%;
    background: #fff3;
    filter: blur(0.01em);
  }

  .arrow.right::before, .arrow.right::after { transform: translate(-50%, -50%) rotate(90deg); }
  .arrow.left::before, .arrow.left::after { transform: translate(-50%, -50%) rotate(-90deg) ; }
  .arrow.down::before, .arrow.down::after { transform: translate(-50%, -50%) rotate(180deg) ; }

  .direction.up { top: 58%; left: 41.9%; }
  .direction.down { top: 72.85%; left: 41.9%; }
  .direction.left { left: 18.25%; top: 65.5%; }
  .direction.right { left: 65.75%; top: 65.5%; }

  .direction.x { top: 14%; left: 35%; }
  .direction.x::before { content: "X"; }

  .direction.y { top: 21.5%; left: 11.25% }
  .direction.y::before { content: "Y"; }

  .direction.a { top: 21.5%; left: 59% }
  .direction.a::before { content: "A"; }

  .direction.b { top: 29%; left: 35% }
  .direction.b::before { content: "B"; }

  .menu {
    width: 19.35%;
    aspect-ratio: 1;
    border: 0.0009em solid var(--color-shadow);
    top: 84.75%;
    left: 60.5%;
    border-radius: 0.003em;
    background: #464b50;
    box-shadow: 
      inset 0 0.001em 0.001em -0.0005em #fff6,
      inset 0 -0.001em 0.001em -0.0005em #0006
  }

  .menu::before {
    content: "";
    width: 67%;
    aspect-ratio: 1;
    background: #33393c;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    box-shadow:
      inset 0 0.0009em 0.00075em #0008,
      0 0.0008em 0.00075em #fff5
  }

  .volume {
    width: 8.5%;
    height: 0.7%;
    background: linear-gradient(#444, #222);
    left: 13.3%;
    top: -0.6%;
    border-radius: 0.0005em 0.0005em 0 0;
    clip-path: polygon(-20% -100%, 32% -100%, 32% 0, 33% 35%, 66% 35%, 67% 0%, 67% -100%, 110% -100%, 110% 120%, -20% 120%);
    z-index: -1;
  }

  .home {
    top: 83.85%;
    left: 17.5%;
    display: grid;
    place-items: center;
    width: 25%;
    aspect-ratio: 1;
    border: 0.0007em solid var(--color-shadow);
    background:
      linear-gradient(#0001, #0005),
      radial-gradient(#0000 52.5%, #9c9a9a 0),
      #404547;
  }

  .home::before {
    content: "";
    top: 23%;
    left: 50%;
    transform: translate(-50%, 0);
    width: 50%;
    height: 24.5%;
    background: conic-gradient(at 50% 0, #0000 132deg, #010202 0 228deg, #0000 0);
    box-shadow: 0 0.00015em 0.0001em -0.00008em #fff
  }

  .home::after {
    content: "";
    color: #010202;
    top: 46%;
    left: 50%;
    transform: translate(-50%, 0);
    width: 39%;
    height: 24.5%;
    box-shadow: 
      inset -0.004em 0,
      inset 0.004em 0,
      inset 0 -0.004em 0,
      0 0.00015em 0.0001em -0.00008em #fff
  }
</style>
</head>
<body>

  <main>
    <article aria-label="Drawing of a Nintendo Switch">
      <section class="controller left">
        <button class="bumper l-bumper"></button>
        <button class="minus"></button>
        <button class="mushroom round"></button>
        <button class="direction arrow round up"></button>
        <button class="direction arrow round left"></button>
        <button class="direction arrow round right"></button>
        <button class="direction arrow round down"></button>
        <button class="menu"></button>
      </section>
      
      <section class="controller right">
        <button class="bumper r-bumper"></button>
        <button class="minus plus"></button>
        <button class="direction round up x"></button>
        <button class="direction round left y"></button>
        <button class="direction round right a"></button>
        <button class="direction round down b"></button>
        <button class="mushroom round"></button>
        <button class="round home"></button>
      </section>
      
      <section class="body">
        <button class="volume"></button>
        <div class="frame"></div>
        <div class="screen">
          
          <div class="boot-sequence">
            <div class="boot-content">
              <p class="copyright">Gamex computer entertainment</p>
              <p class="branding">GMX<span class="is-small">®</span> &nbsp; 1</p>
            </div>
            <div class="boot-inner">
              <div class="particles">
                <span></span><span></span><span></span>
              </div>
              <div class="boxes-wrapper"></div>
            </div>
          </div>
          </div>
      </section>
    </article>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // 1. Standard Button Haptics
      const standardButtons = document.querySelectorAll('button:not(.mushroom):not(.home)');
      const handlePress = (e, btn) => {
        e.preventDefault();
        btn.classList.add('active');
      };
      const handleRelease = (e, btn) => {
        e.preventDefault();
        btn.classList.remove('active');
      };

      standardButtons.forEach(btn => {
        btn.addEventListener('touchstart', (e) => handlePress(e, btn), { passive: false });
        btn.addEventListener('touchend', (e) => handleRelease(e, btn), { passive: false });
        btn.addEventListener('touchcancel', (e) => handleRelease(e, btn), { passive: false });
        btn.addEventListener('mousedown', (e) => handlePress(e, btn));
        btn.addEventListener('mouseup', (e) => handleRelease(e, btn));
        btn.addEventListener('mouseleave', (e) => handleRelease(e, btn));
      });

      // 2. Dynamic 3D Boot Screen Generator
      const boxesWrapper = document.querySelector('.boxes-wrapper');
      const hiddenBoxes = [41, 40, 47, 48, 46, 95, 94, 102, 101];

      for (let i = 1; i <= 112; i++) {
        const container = document.createElement('div');
        container.className = 'box-container';
        if (hiddenBoxes.includes(i)) container.style.visibility = 'hidden';

        const box = document.createElement('div');
        box.className = 'box';

        const zDepth = (Math.random() * 0.15) - 0.15;
        box.style.transform = `translateZ(${zDepth}em)`;

        const darken = 1 - (Math.random() * 0.4);
        box.style.backgroundColor = `rgba(${136 * darken}, ${147 * darken}, ${184 * darken}, 0.95)`;

        box.innerHTML = `
          <div class="top"></div>
          <div class="bottom"></div>
          <div class="left"></div>
          <div class="right"></div>
        `;
        
        container.appendChild(box);
        boxesWrapper.appendChild(container);
      }

      // 3. Audio Tracking Engine
      let globalCtx = null;
      let activeOscillators = [];
      let currentMasterGain = null;
      
      const initAudioContext = () => {
        if (!globalCtx) {
          globalCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (globalCtx.state === 'suspended') {
          globalCtx.resume();
        }
      };

      document.addEventListener('touchstart', initAudioContext, { once: true });
      document.addEventListener('mousedown', initAudioContext, { once: true });

      function stopBootSound() {
        if (!globalCtx) return;
        const now = globalCtx.currentTime;

        // Fade out quickly to prevent audio clicks
        if (currentMasterGain) {
          currentMasterGain.gain.cancelScheduledValues(now);
          currentMasterGain.gain.setValueAtTime(currentMasterGain.gain.value, now);
          currentMasterGain.gain.linearRampToValueAtTime(0.0001, now + 0.05);
        }

        // Hard stop all active oscillators
        activeOscillators.forEach(osc => {
          try {
            osc.stop(now + 0.06);
          } catch (e) {
            // Already stopped or scheduled
          }
        });
        activeOscillators = [];
      }

      function playBootSound() {
        initAudioContext(); 
        const ctx = globalCtx;
        const now = ctx.currentTime;
        const totalDuration = 8.5; 

        stopBootSound(); // Ensure everything is clear before starting a new boot

        // Master Output
        currentMasterGain = ctx.createGain();
        currentMasterGain.gain.setValueAtTime(0.5, now);
        currentMasterGain.connect(ctx.destination);

        const masterFilter = ctx.createBiquadFilter();
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setValueAtTime(1500, now);
        masterFilter.frequency.linearRampToValueAtTime(800, now + totalDuration);
        masterFilter.connect(currentMasterGain);

        function playString(freq, start, duration, maxVol) {
          const detunes = [-8, 0, 8]; 
          
          detunes.forEach(detune => {
            const osc = ctx.createOscillator();
            activeOscillators.push(osc); // Track oscillator
            const gain = ctx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            osc.detune.value = detune;

            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(maxVol / 3, start + 1.5); 
            gain.gain.setValueAtTime(maxVol / 3, start + duration - 2.0); 
            gain.gain.linearRampToValueAtTime(0, start + duration); 

            osc.connect(gain);
            gain.connect(masterFilter);
            
            osc.start(start);
            osc.stop(start + duration);
          });
        }

        function playBass(freq, start, duration, maxVol) {
          ['triangle', 'sine'].forEach((type, i) => {
            const osc = ctx.createOscillator();
            activeOscillators.push(osc); // Track oscillator
            const gain = ctx.createGain();
            
            osc.type = type;
            osc.frequency.value = freq / (i + 1); 

            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(maxVol, start + 1.0); 
            gain.gain.setValueAtTime(maxVol, start + duration - 2.0);
            gain.gain.linearRampToValueAtTime(0, start + duration);

            const bassFilter = ctx.createBiquadFilter();
            bassFilter.type = 'lowpass';
            bassFilter.frequency.value = 400;
            
            osc.connect(gain);
            gain.connect(bassFilter);
            bassFilter.connect(currentMasterGain);

            osc.start(start);
            osc.stop(start + duration);
          });
        }

        // Sequence
        playBass(77.78, now, 4.5, 0.3);
        playBass(155.56, now, 4.5, 0.15);
        playString(311.13, now, 4.5, 0.12);
        playString(392.00, now, 4.5, 0.12);
        playString(466.16, now, 4.5, 0.12);
      }

      // 4. Power Button Logic
      const homeBtn = document.querySelector('.home');
      const screen = document.querySelector('.screen');
      let isPoweredOn = false;

      screen.classList.add('power-off'); 

      const togglePower = (e) => {
        e.preventDefault();
        homeBtn.classList.add('active');
        setTimeout(() => homeBtn.classList.remove('active'), 100); 
        
        isPoweredOn = !isPoweredOn;
        
        if (isPoweredOn) {
          screen.classList.remove('power-off');
          screen.classList.remove('is-booting');
          void screen.offsetWidth;
          screen.classList.add('is-booting');
          playBootSound();
        } else {
          screen.classList.add('power-off');
          screen.classList.remove('is-booting');
          stopBootSound(); // Shuts down audio instantly
        }
      };

      homeBtn.addEventListener('touchstart', togglePower, { passive: false });
      homeBtn.addEventListener('mousedown', togglePower);

      // 5. Joystick Drag Physics
      const mushrooms = document.querySelectorAll('.mushroom');
      const maxDragRadius = 12; 

      mushrooms.forEach(stick => {
        let isDragging = false;
        let startX, startY;

        const startDrag = (e) => {
          e.preventDefault();
          isDragging = true;
          stick.classList.add('dragging');
          const pointer = e.touches ? e.touches[0] : e;
          startX = pointer.clientX;
          startY = pointer.clientY;
        };

        const doDrag = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          const pointer = e.touches ? e.touches[0] : e;
          const dx = pointer.clientX - startX;
          const dy = pointer.clientY - startY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const clampedDistance = Math.min(distance, maxDragRadius);
          const angle = Math.atan2(dy, dx);
          
          const moveX = Math.cos(angle) * clampedDistance;
          const moveY = Math.sin(angle) * clampedDistance;
          stick.style.transform = `translate(${moveX}px, ${moveY}px)`;
        };

        const stopDrag = (e) => {
          if (!isDragging) return;
          e.preventDefault();
          isDragging = false;
          stick.classList.remove('dragging');
          stick.style.transform = ''; 
        };

        stick.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('touchmove', doDrag, { passive: false });
        document.addEventListener('touchend', stopDrag, { passive: false });
        stick.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('mouseup', stopDrag);
      });

    });
  </script>
    <script>
  // Register the Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('[GMX SW] Registration successful with scope: ', registration.scope);
        })
        .catch((error) => {
          console.log('[GMX SW] Registration failed: ', error);
        });
    });
  }
</script>
</body>
</html>
